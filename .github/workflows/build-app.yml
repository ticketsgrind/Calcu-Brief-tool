name: Bouw standalone app (Windows + Mac)

# Bouwt een echte, op zichzelf staande .exe (Windows) en .app (Mac) met
# PyInstaller -- Python zit erin gebakken, dus een collega hoeft niets te
# installeren: downloaden van de Release-pagina en dubbelklikken is genoeg.
# Draait op GitHub's eigen Windows-/Mac-runners omdat je een .exe/.app niet
# vanaf een andere besturingssysteem kunt bouwen (geen cross-compilatie).

on:
  push:
    branches: [claude/magical-davinci-63dmec]
    paths:
      - "server.py"
      - "overdracht.py"
      - "brieventool/**"
      - "calculatie/**"
      - "scherm/**"
      - "data/**"
      - "analyse/**"
      - "config/**"
      - "sjablonen/**"
      - "requirements.txt"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        # Het native laadscherm (tkinter + dit filmpje als gif) bleek op
        # sommige machines de app te laten crashen vóórdat er iets te zien
        # was -- zie CLAUDE.md. Uitgeschakeld in server.py; hier alleen nog
        # het bestand zelf overslaan zodat het niet nutteloos meegepakt
        # wordt (scherm/ wordt hieronder in zijn geheel meegenomen). Het
        # bestand blijft gewoon in de repository staan voor als dit ooit
        # veiliger opnieuw wordt opgepakt.
        shell: pwsh
        run: Remove-Item scherm/laadscherm.mp4 -ErrorAction SilentlyContinue
      - name: Bouw CalcuBriefTool.exe
        # --onedir (niet --onefile): een onefile-.exe pakt zichzelf bij ELKE
        # start opnieuw uit naar een tijdelijke map, wat met dit filmpje erbij
        # (~7MB) een merkbare vertraging gaf voordat de browser zelfs maar
        # opende. --onedir start meteen; de prijs is dat de download een map
        # is in plaats van één los bestand.
        run: >
          pyinstaller --onedir --noconsole --name CalcuBriefTool
          --add-data "analyse;analyse"
          --add-data "config;config"
          --add-data "sjablonen;sjablonen"
          --add-data "data;data"
          --add-data "scherm;scherm"
          server.py
      - name: Zip de map
        shell: pwsh
        run: Compress-Archive -Path dist/CalcuBriefTool -DestinationPath dist/CalcuBriefTool-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-windows
          path: dist/CalcuBriefTool-windows.zip
      - name: Publiceer op de Release-pagina
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Elke build verwijdert de vorige release helemaal en maakt 'm
          # opnieuw aan, in plaats van bestaande assets te vervangen. Zowel
          # gh release upload --clobber als een losse gh release delete-asset
          # bleken op dit release-object herhaaldelijk een 404 te geven op
          # een asset-ID die gh's eigen lijst-aanroep er vlak daarvoor nog
          # wél voor teruggaf -- een inconsistentie aan GitHub's kant zelf,
          # niet iets wat met een andere gh-aanroep op te lossen was. De
          # downloadlink (.../releases/tag/app-download) blijft hetzelfde,
          # want de tagnaam blijft gelijk.
          gh release delete app-download --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create app-download --repo "$GITHUB_REPOSITORY" \
            --title "Calcu-Brief-tool — desktop-app" \
            --notes "Automatisch gebouwd uit de branch claude/magical-davinci-63dmec. Uitpakken en CalcuBriefTool.exe (in de map) dubbelklikken; geen Python nodig."
          gh release upload app-download dist/CalcuBriefTool-windows.zip --repo "$GITHUB_REPOSITORY"

  macos:
    needs: windows  # voorkomt dat beide jobs tegelijk de release proberen aan te maken
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        run: rm -f scherm/laadscherm.mp4
      - name: Bouw CalcuBriefTool.app
        # --onedir is hier al PyInstaller's eigen standaard (in tegenstelling
        # tot Windows hierboven, waar --onefile expliciet aan moest staan);
        # alleen hier ook expliciet genoemd zodat dat geen verrassing is.
        run: >
          pyinstaller --onedir --windowed --name CalcuBriefTool
          --add-data "analyse:analyse"
          --add-data "config:config"
          --add-data "sjablonen:sjablonen"
          --add-data "data:data"
          --add-data "scherm:scherm"
          server.py
      - name: Zip de .app (bewaart de bundel-structuur en het uitvoerbaar-vlag)
        run: cd dist && ditto -c -k --keepParent CalcuBriefTool.app CalcuBriefTool-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-mac
          path: dist/CalcuBriefTool-mac.zip
      - name: Publiceer op de Release-pagina
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De windows-job hierboven heeft de release al vers aangemaakt.
          gh release upload app-download dist/CalcuBriefTool-mac.zip --repo "$GITHUB_REPOSITORY"
