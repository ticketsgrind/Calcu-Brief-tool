name: Bouw standalone app (Windows + Mac)

# Bouwt een echte, op zichzelf staande .exe (Windows) en .app (Mac) met
# PyInstaller -- Python zit erin gebakken, dus een collega hoeft niets te
# installeren: downloaden van de Release-pagina en dubbelklikken is genoeg.
# Draait op GitHub's eigen Windows-/Mac-runners omdat je een .exe/.app niet
# vanaf een andere besturingssysteem kunt bouwen (geen cross-compilatie).

on:
  push:
    branches: [claude/magical-davinci-63dmec]
    paths:
      - "server.py"
      - "overdracht.py"
      - "brieventool/**"
      - "calculatie/**"
      - "scherm/**"
      - "data/**"
      - "analyse/**"
      - "config/**"
      - "sjablonen/**"
      - "requirements.txt"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        # Het native laadscherm (tkinter + dit filmpje als gif) bleek op
        # sommige machines de app te laten crashen vóórdat er iets te zien
        # was -- zie CLAUDE.md. Uitgeschakeld in server.py; hier alleen nog
        # het bestand zelf overslaan zodat het niet nutteloos meegepakt
        # wordt (scherm/ wordt hieronder in zijn geheel meegenomen). Het
        # bestand blijft gewoon in de repository staan voor als dit ooit
        # veiliger opnieuw wordt opgepakt.
        shell: pwsh
        run: Remove-Item scherm/laadscherm.mp4 -ErrorAction SilentlyContinue
      - name: Bouw CalcuBriefTool.exe
        # --onedir (niet --onefile): een onefile-.exe pakt zichzelf bij ELKE
        # start opnieuw uit naar een tijdelijke map, wat met dit filmpje erbij
        # (~7MB) een merkbare vertraging gaf voordat de browser zelfs maar
        # opende. --onedir start meteen; de prijs is dat de download een map
        # is in plaats van één los bestand.
        run: >
          pyinstaller --onedir --noconsole --name CalcuBriefTool
          --add-data "analyse;analyse"
          --add-data "config;config"
          --add-data "sjablonen;sjablonen"
          --add-data "data;data"
          --add-data "scherm;scherm"
          server.py
      - name: Zip de map
        shell: pwsh
        run: Compress-Archive -Path dist/CalcuBriefTool -DestinationPath dist/CalcuBriefTool-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-windows
          path: dist/CalcuBriefTool-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        run: rm -f scherm/laadscherm.mp4
      - name: Bouw CalcuBriefTool.app
        # --onedir is hier al PyInstaller's eigen standaard (in tegenstelling
        # tot Windows hierboven, waar --onefile expliciet aan moest staan);
        # alleen hier ook expliciet genoemd zodat dat geen verrassing is.
        run: >
          pyinstaller --onedir --windowed --name CalcuBriefTool
          --add-data "analyse:analyse"
          --add-data "config:config"
          --add-data "sjablonen:sjablonen"
          --add-data "data:data"
          --add-data "scherm:scherm"
          server.py
      - name: Zip de .app (bewaart de bundel-structuur en het uitvoerbaar-vlag)
        run: cd dist && ditto -c -k --keepParent CalcuBriefTool.app CalcuBriefTool-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-mac
          path: dist/CalcuBriefTool-mac.zip

  publiceer:
    # Eén job die als enige de Release-pagina beheert, pas nadat beide
    # platforms gebouwd zijn -- zie de uitleg bij de stap hieronder voor
    # waarom dit niet meer per-platform gebeurt (zoals hiervoor wel het
    # geval was).
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CalcuBriefTool-windows
          path: bestanden
      - uses: actions/download-artifact@v4
        with:
          name: CalcuBriefTool-mac
          path: bestanden
      - name: Publiceer op de Release-pagina
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Eerdere versies van dit workflow-bestand deden dit per platform
          # (windows uploadde eerst, macos daarna naar dezelfde release) en
          # probeerden bij een mislukte upload steeds opnieuw tegen datzelfde
          # release-object. Dat bleek niet te repareren: een upload-poging
          # kan op GitHub's kant een asset-naam "reserveren" zonder dat het
          # bestand ooit zichtbaar wordt (gh release upload gaf daarna een
          # HTTP 422 "ReleaseAsset.name already exists" op precies die naam,
          # terwijl gh release view --json assets nog altijd assets: []
          # liet zien -- ook een kwartier later nog). Dat is geen kwestie
          # van even wachten: die naam op dát release-object bleef
          # permanent kapot, dus opnieuw uploaden tegen diezelfde release
          # loopt telkens tegen dezelfde muur op. De enige uitweg bleek de
          # hele release weg te gooien en helemaal opnieuw te beginnen.
          #
          # Vandaar nu: één centrale publicatiestap die de HELE cyclus
          # (verwijderen, aanmaken, allebei de bestanden uploaden, navragen)
          # als één geheel herhaalt bij een mislukking, in plaats van alleen
          # de upload-stap. Zo blijft er nooit een release liggen met één
          # kapotte assetnaam-reservering waar een volgende poging weer
          # tegenaan loopt. Dit ook in één job voor beide platforms samen
          # (met actions/download-artifact hierboven om bij allebei de
          # bestanden te kunnen) -- anders zou "windows lukt, mac loopt vast"
          # de mac-job voor de keus stellen tussen de werkende windows-asset
          # meenemen bij een noodzakelijke volledige release-reset, of een
          # eigen, aparte reset-mechaniek bouwen dat de windows-asset dan
          # weer stuk zou kunnen maken.
          bestanden=(CalcuBriefTool-windows.zip CalcuBriefTool-mac.zip)

          for cyclus in 1 2 3; do
            echo "=== Cyclus $cyclus: release helemaal opnieuw aanmaken ==="
            gh release delete app-download --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            sleep 5
            gh release create app-download --repo "$GITHUB_REPOSITORY" \
              --title "Calcu-Brief-tool — desktop-app" \
              --notes "Automatisch gebouwd uit de branch claude/magical-davinci-63dmec. Uitpakken en CalcuBriefTool.exe (in de map) dubbelklikken; geen Python nodig."
            sleep 10

            for bestand in "${bestanden[@]}"; do
              gh release upload app-download "bestanden/$bestand" --repo "$GITHUB_REPOSITORY" || true
            done
            sleep 10

            aanwezig="$(gh release view app-download --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[].name")"
            compleet=true
            for bestand in "${bestanden[@]}"; do
              if ! echo "$aanwezig" | grep -qx "$bestand"; then
                echo "Cyclus $cyclus: $bestand nog niet zichtbaar op de release-pagina."
                compleet=false
              fi
            done

            if $compleet; then
              echo "Beide bestanden staan op de release-pagina (cyclus $cyclus)."
              exit 0
            fi
          done
          echo "::error::Na meerdere volledige release-cycli stonden niet beide bestanden op de release-pagina."
          exit 1
