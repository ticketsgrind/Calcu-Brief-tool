name: Bouw standalone app (Windows + Mac)

# Bouwt een echte, op zichzelf staande .exe (Windows) en .app (Mac) met
# PyInstaller -- Python zit erin gebakken, dus een collega hoeft niets te
# installeren: downloaden van de Release-pagina en dubbelklikken is genoeg.
# Draait op GitHub's eigen Windows-/Mac-runners omdat je een .exe/.app niet
# vanaf een andere besturingssysteem kunt bouwen (geen cross-compilatie).

on:
  push:
    branches: [claude/magical-davinci-63dmec]
    paths:
      - "server.py"
      - "overdracht.py"
      - "brieventool/**"
      - "calculatie/**"
      - "scherm/**"
      - "data/**"
      - "analyse/**"
      - "config/**"
      - "sjablonen/**"
      - "requirements.txt"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        # Het native laadscherm (tkinter + dit filmpje als gif) bleek op
        # sommige machines de app te laten crashen vóórdat er iets te zien
        # was -- zie CLAUDE.md. Uitgeschakeld in server.py; hier alleen nog
        # het bestand zelf overslaan zodat het niet nutteloos meegepakt
        # wordt (scherm/ wordt hieronder in zijn geheel meegenomen). Het
        # bestand blijft gewoon in de repository staan voor als dit ooit
        # veiliger opnieuw wordt opgepakt.
        shell: pwsh
        run: Remove-Item scherm/laadscherm.mp4 -ErrorAction SilentlyContinue
      - name: Bouw CalcuBriefTool.exe
        # --onedir (niet --onefile): een onefile-.exe pakt zichzelf bij ELKE
        # start opnieuw uit naar een tijdelijke map, wat met dit filmpje erbij
        # (~7MB) een merkbare vertraging gaf voordat de browser zelfs maar
        # opende. --onedir start meteen; de prijs is dat de download een map
        # is in plaats van één los bestand.
        run: >
          pyinstaller --onedir --noconsole --name CalcuBriefTool
          --add-data "analyse;analyse"
          --add-data "config;config"
          --add-data "sjablonen;sjablonen"
          --add-data "data;data"
          --add-data "scherm;scherm"
          server.py
      - name: Zip de map
        shell: pwsh
        run: Compress-Archive -Path dist/CalcuBriefTool -DestinationPath dist/CalcuBriefTool-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-windows
          path: dist/CalcuBriefTool-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Verwijder het (uitgeschakelde) laadscherm-filmpje uit de build
        run: rm -f scherm/laadscherm.mp4
      - name: Bouw CalcuBriefTool.app
        # --onedir is hier al PyInstaller's eigen standaard (in tegenstelling
        # tot Windows hierboven, waar --onefile expliciet aan moest staan);
        # alleen hier ook expliciet genoemd zodat dat geen verrassing is.
        run: >
          pyinstaller --onedir --windowed --name CalcuBriefTool
          --add-data "analyse:analyse"
          --add-data "config:config"
          --add-data "sjablonen:sjablonen"
          --add-data "data:data"
          --add-data "scherm:scherm"
          server.py
      - name: Zip de .app (bewaart de bundel-structuur en het uitvoerbaar-vlag)
        run: cd dist && ditto -c -k --keepParent CalcuBriefTool.app CalcuBriefTool-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CalcuBriefTool-mac
          path: dist/CalcuBriefTool-mac.zip

  publiceer:
    # Eén job die als enige de Release-pagina beheert, pas nadat beide
    # platforms gebouwd zijn -- zie de uitleg bij de stap hieronder voor
    # waarom dit niet meer per-platform gebeurt (zoals hiervoor wel het
    # geval was).
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CalcuBriefTool-windows
          path: bestanden
      - uses: actions/download-artifact@v4
        with:
          name: CalcuBriefTool-mac
          path: bestanden
      - name: Publiceer op de Release-pagina
        # De diagnostische versie van deze stap (zie git-historie) bewees dat
        # de uploads de hele tijd al gewoon lukten: gh release upload gaf
        # exitcode 0, en een rauwe gh api-aanroep vlak erna liet beide
        # assets zien met state "uploaded" en de juiste bestandsgrootte.
        # De eerdere "fixes" (--clobber, delete-asset, de hele release
        # steeds weggooien en opnieuw aanmaken) losten dus een bestaand
        # probleem niet op, want er WAS geen probleem met uploaden -- ze
        # reageerden op een foute navraag. Het echte probleem zat in de
        # navraag zelf: gh release view --json assets gaf ook ver ná een
        # geslaagde upload nog assets: [] terug, zelfs enkele seconden na de
        # upload in dezelfde job. gh api op hetzelfde adres (rechtstreeks de
        # REST-endpoint, zonder gh's eigen view-laag) klopte wél meteen. Dus:
        # navragen via gh api, niet via gh release view. En geen release
        # meer weggooien-en-opnieuw-aanmaken bij een "niet zichtbaar"-
        # navraag -- dat vernietigde eerder waarschijnlijk meermaals een
        # release waarvan de assets allang goed stonden, alleen nog niet
        # zichtbaar waren via de (onbetrouwbare) navraagmethode.
        #
        # gh release view --json assets --jq bleek trouwens ook voor de
        # navraag hierbuiten (bijv. Claude's eigen release-check) tot wel
        # een kwartier achter te kunnen lopen op wat er echt staat -- dat is
        # dus geen kwestie van hier nog harder pollen, en verklaart ook
        # waarom een build die network hier "klaar" meldt de download op de
        # Release-pagina soms nog even niet toont: geef het gewoon wat tijd,
        # er hoeft niets opnieuw gebouwd te worden.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-download --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          sleep 5
          gh release create app-download --repo "$GITHUB_REPOSITORY" \
            --title "Calcu-Brief-tool — desktop-app" \
            --notes "Automatisch gebouwd uit de branch claude/magical-davinci-63dmec. Uitpakken en CalcuBriefTool.exe (in de map) dubbelklikken; geen Python nodig."
          sleep 5

          for bestand in CalcuBriefTool-windows.zip CalcuBriefTool-mac.zip; do
            for poging in 1 2 3; do
              if gh release upload app-download "bestanden/$bestand" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              echo "Upload van $bestand mislukte (poging $poging), nog eens proberen..."
              sleep 5
            done
          done

          sleep 5
          aanwezig="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-download" --jq '.assets[].name')"
          for bestand in CalcuBriefTool-windows.zip CalcuBriefTool-mac.zip; do
            if ! echo "$aanwezig" | grep -qx "$bestand"; then
              echo "::error::$bestand staat niet op de release (gh api zag: $aanwezig)."
              exit 1
            fi
          done
          echo "Beide bestanden staan op de release-pagina."
