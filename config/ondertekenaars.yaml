# Ondertekenaars van de offertebrieven.
#
# Een nieuwe collega toevoegen is één blok hieronder erbij — er hoeft geen code
# aangepast te worden. De sleutel (bijv. nick_vervoorn) is de waarde die de tool
# in het keuzemenu gebruikt.
#
# `initialen` wordt gebruikt voor het eerste deel van het veld "Ref."
# (patroon: <initialen ondertekenaar>/[<initialen opsteller>/]SA<volgnummer>).
#
# Velden met `null` konden niet uit de brieven gehaald worden. Onder de
# ondertekening staan alleen naam en functie; telefoonnummers en e-mailadressen
# komen in de brieven uitsluitend voor als algemene bedrijfsgegevens in de
# briefkop. Zie analyse/vragen.md vraag 5.

ondertekenaars:

  nick_vervoorn:
    naam: "Nick Vervoorn"
    functie: "Technisch Commercieel Adviseur"
    initialen: "NV"           # bevestigd uit Ref. NV/... in 6 uitgewerkte brieven
    telefoon: null            # staat niet in de brieven
    mobiel: null              # staat niet in de brieven
    email: null               # staat niet in de brieven
    handtekening: null        # geen handtekeningafbeelding aangetroffen

  john_van_de_weetering:
    naam: "John van de Weetering"
    # LET OP: de sjablonen schrijven consequent "Weetering" met dubbele e,
    # de opdrachtgever schreef "Wetering". Zie analyse/vragen.md vraag 14.
    functie: "Technisch Commercieel Manager"
    initialen: "JvdW"         # bevestigd uit Ref. JvdW/VL/SA35838
    telefoon: null
    mobiel: null
    email: null
    handtekening: null

  ricardo_rozendaal:
    naam: "Ricardo Rozendaal"
    functie: "Project Engineer"
    initialen: "RR"           # afgeleid, niet bevestigd: geen Ref. met RR aangetroffen
    telefoon: null
    mobiel: null
    email: null
    handtekening: null

  robert_hartman:
    # Niet genoemd in de opdracht, wel aangetroffen als ondertekenaar van de
    # uitgewerkte brieven (Ref. RH/...). Zie analyse/vragen.md vraag 4.
    naam: "Robert Hartman"
    functie: "Business Unit General Manager"
    initialen: "RH"           # bevestigd uit Ref. RH/...
    telefoon: null
    mobiel: null
    email: null
    handtekening: null

# Opstellers: het optionele middendeel van het veld "Ref.". Wie dit zijn is nog
# niet bevestigd — zie analyse/vragen.md vraag 1d.
opstellers:
  RdJ: null                   # aangetroffen in 4 brieven
  VL: null                    # aangetroffen in 1 brief
  LH: null                    # aangetroffen in 1 brief

