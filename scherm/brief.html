<meta charset="utf-8">
<title>Offertebrieven Schilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* De huisstijl van Schilt: het blauw van de website, het leisteengrijs van
     het woordmerk en de rode zwiep als klein accent. De grijzen hebben een
     blauwzweem zodat ze bij dat blauw horen en niet als kaal grijs lezen. */
  --ground:#E7EBF0; --surface:#F6F8FA; --raised:#FFFFFF;
  --ink:#1C262B; --muted:#5B686E; --faint:#88959C;
  --line:#D3DAE0; --line-soft:#E3E8EC;
  --accent:#3A5EC4; --accent-ink:#FFFFFF; --accent-soft:#DEE5F8;
  --merk:#414B4D; --rood:#D9121E; --logoveld:transparent;
  --signal:#A8641B; --signal-soft:#F4E5D1;
  --paper:#FBF9F5; --paper-ink:#23201B; --paper-line:#DAD5CA;
  --shadow:0 1px 2px rgba(28,38,43,.06), 0 8px 24px rgba(28,38,43,.09);
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --brief:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111821; --surface:#19212A; --raised:#202A34;
  --ink:#DDE4EA; --muted:#93A2AB; --faint:#6E7D86;
  --line:#2D3944; --line-soft:#252F39;
  --accent:#87A3EA; --accent-ink:#0D1420; --accent-soft:#233150;
  --merk:#C2CBCF; --rood:#F0616B; --logoveld:#FFFFFF;
  --signal:#D89A4A; --signal-soft:#33281A;
  --paper:#E9E5DD; --paper-ink:#23201B; --paper-line:#C9C3B6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#111821; --surface:#19212A; --raised:#202A34;
  --ink:#DDE4EA; --muted:#93A2AB; --faint:#6E7D86;
  --line:#2D3944; --line-soft:#252F39;
  --accent:#87A3EA; --accent-ink:#0D1420; --accent-soft:#233150;
  --merk:#C2CBCF; --rood:#F0616B; --logoveld:#FFFFFF;
  --signal:#D89A4A; --signal-soft:#33281A;
  --paper:#E9E5DD; --paper-ink:#23201B; --paper-line:#C9C3B6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- kop ---------- */
.kop{display:flex;align-items:center;gap:16px;padding:0 18px;height:60px;
  background:var(--raised);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;flex-wrap:wrap}
.merk{display:flex;align-items:center;gap:12px;min-width:0}
.merk .beeldmerk{height:21px;width:174px;flex:none;background-repeat:no-repeat;
  background-size:contain;background-position:left center;
  background-color:var(--logoveld);border-radius:2px;
  box-shadow:0 0 0 4px var(--logoveld)}

.merk .naam{font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--merk);
  white-space:nowrap;padding-left:12px;border-left:1px solid var(--line)}
.kop-mid{flex:1;min-width:120px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kenmerk{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.kenmerk b{color:var(--ink);font-weight:500}
.kop-acties{display:flex;align-items:center;gap:8px;position:relative}
.naamkiezer{position:absolute;right:0;top:calc(100% + 8px);z-index:30;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:12px 13px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:320px;
  display:flex;flex-direction:column;gap:8px}
.naamkiezer[hidden]{display:none}
.naamkiezer label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:600}
.naamrij{display:flex;align-items:center;gap:6px}
.naamrij input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:6px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--raised);color:inherit}
.naamrij input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.naamrij .ext{font-family:var(--mono);font-size:12px;color:var(--muted)}
.naamknoppen{display:flex;justify-content:space-between;align-items:center;gap:8px}
.naamvoorstel{background:none;border:none;padding:0;font:inherit;font-size:11.5px;
  color:var(--muted);text-decoration:underline;cursor:pointer;text-align:left}

.knop{background:var(--raised);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s}
.knop:hover{border-color:var(--accent);color:var(--accent)}
.knop.aan{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.knop.hoofd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:600;padding:6px 17px}
.knop.hoofd:hover{filter:brightness(1.08);color:var(--accent-ink)}
.stip{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.knop.aan .stip{opacity:1}

/* ---------- werkblad ---------- */
.blad{display:grid;grid-template-columns:minmax(340px,400px) 1fr;
  height:calc(100dvh - 56px)}
@media (max-width:900px){.blad{grid-template-columns:1fr;height:auto}}

/* ---------- vragen ---------- */
.vragen{overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);
  padding:14px 14px 60px;display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){.vragen{border-right:0;border-bottom:1px solid var(--line);max-height:none}}

.groep{flex:none;background:var(--raised);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
.groep[open]{border-color:var(--line)}
.groep>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;gap:10px;user-select:none}
.groep>summary::-webkit-details-marker{display:none}
.groep>summary:hover{background:var(--surface)}
.pijl{width:8px;height:8px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);
  transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:1px}
.groep[open]>summary .pijl{transform:rotate(45deg)}
.gtitel{font-weight:600;font-size:13px;letter-spacing:-.005em}
.gsamen{margin-left:auto;font-size:11.5px;color:var(--faint);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.groep[open] .gsamen{opacity:0}
.ginhoud{padding:4px 13px 15px;display:flex;flex-direction:column;gap:13px;
  border-top:1px solid var(--line-soft)}

.veld{display:flex;flex-direction:column;gap:5px}
.veld>label,.blabel{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted)}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rij3{display:grid;grid-template-columns:auto 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 9px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;font-size:13px;transition:border-color .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
input.code,input.geld{font-family:var(--mono);font-size:12.5px}
textarea{resize:vertical;min-height:56px;font-size:13px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
  linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

.segment{display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:2px;gap:2px}
.segment button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px 8px;
  font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s}
.segment button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.segment button:hover:not([aria-pressed=true]){color:var(--ink)}

.vink{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13px;padding:1px 0}
.vink input{margin:2px 0 0;accent-color:var(--accent);flex:none;width:15px;height:15px}
.vinklijst{display:flex;flex-direction:column;gap:3px;max-height:none}

.afgeleid{display:flex;gap:9px;align-items:flex-start;background:var(--signal-soft);
  border:1px solid color-mix(in srgb,var(--signal) 32%,transparent);
  border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.afgeleid .merkje{color:var(--signal);font-weight:700;flex:none;font-size:13px;line-height:1.3}
.afgeleid b{font-weight:600}

.kaart{border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--surface);
  display:flex;flex-direction:column;gap:10px;position:relative}
.kaartkop{display:flex;align-items:center;gap:8px}
.kaartnr{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent);
  background:var(--accent-soft);border-radius:4px;padding:2px 6px;letter-spacing:.03em}
.weg{margin-left:auto;border:0;background:transparent;color:var(--faint);cursor:pointer;
  font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}
.weg:hover{color:var(--signal);background:var(--signal-soft)}
.neerzetvak{border:1.5px dashed var(--line);border-radius:9px;padding:16px 13px;
  text-align:center;cursor:pointer;transition:.14s;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;gap:5px}
.neerzetvak:hover,.neerzetvak.erboven{border-color:var(--accent);background:var(--accent-soft)}
.neerzetvak .pictogram{font-size:19px;line-height:1;opacity:.75}
.neerzetvak .hoofd{font-size:13px;font-weight:600}
.neerzetvak .bij{font-size:11.5px;color:var(--faint)}
.neerzetvak input[type=file]{display:none}
.bestand{display:flex;align-items:center;gap:9px;background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:7px;padding:8px 10px;font-size:12.5px}
.bestand .naam{font-family:var(--mono);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1}
.bestand .aantal{color:var(--muted);font-size:11px;white-space:nowrap}
.scheiding{display:flex;align-items:center;gap:9px;color:var(--faint);font-size:11px;
  text-transform:uppercase;letter-spacing:.08em}
.scheiding::before,.scheiding::after{content:"";flex:1;height:1px;background:var(--line)}
.specveld{font-family:var(--mono);font-size:11.5px;min-height:104px;line-height:1.5}
.toevoeg{border:1px dashed var(--line);background:transparent;border-radius:8px;
  padding:9px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.12s}
.toevoeg:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- brief ---------- */
.briefkant{overflow-y:auto;padding:26px 20px 70px;display:flex;flex-direction:column;
  align-items:center;gap:14px}
.briefbalk{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;
  font-size:11.5px;color:var(--faint)}
.briefbalk .telling{font-family:var(--mono)}
.briefbalk .rest{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Het vel heeft de verhouding en de marges van het echte briefpapier: A4 met
   4 cm boven, 2,8 cm links en 2,5 cm rechts. --mm is de schaal waarmee een
   millimeter op het scherm wordt getekend, zodat de regels ongeveer op dezelfde
   plek afbreken als in Word. */
.vel{--mm:3.05px; --pb:210; --pl:28; --pr:25; --pt:40; --pv:20;
  width:calc(var(--pb) * var(--mm)); max-width:100%;
  background:var(--paper);color:var(--paper-ink);
  box-shadow:var(--shadow);border-radius:2px;position:relative;
  padding:calc(var(--pt) * var(--mm)) calc(var(--pr) * var(--mm))
          calc(var(--pv) * var(--mm)) calc(var(--pl) * var(--mm));
  font-family:var(--brief);font-size:calc(var(--mm) * 3.3);line-height:1.55}
@media (max-width:760px){.vel{--mm:2.4px}}

/* Briefkop: het logo linksboven en de bedrijfsgegevens rechtsboven, op de
   plek waar Word ze zet. */
.papierkop{position:absolute;left:0;right:0;top:calc(12.5 * var(--mm));
  height:calc(24 * var(--mm))}
.papierkop img{position:absolute;display:block}
.papiergegevens{position:absolute;right:calc(var(--pr) * var(--mm));top:0;
  text-align:right;font-size:calc(var(--mm) * 2.1);line-height:1.42;color:#6E675C;
  white-space:pre-line}
.papiervoet{position:absolute;left:calc(var(--pl) * var(--mm));
  right:calc(var(--pr) * var(--mm));bottom:calc(7 * var(--mm));
  font-size:calc(var(--mm) * 1.95);line-height:1.4;color:#8C8478}
.papiervoet img{position:absolute;display:block}
.papiermelding{position:absolute;left:calc(var(--pl) * var(--mm));bottom:calc(2 * var(--mm));
  font-family:var(--ui);font-size:9px;color:#A79E8E;letter-spacing:.02em}



/* De witruimte op het vel is dezelfde als in het Word-bestand: een lege regel
   is een lege alinea, dus precies één regelhoogte. Welke alinea er een krijgt
   zegt de motor met witregel_erna; het scherm verzint hier niets bij. */
.sectie{margin:0;position:relative}
.alinea{margin:0;white-space:pre-wrap;position:relative;border-radius:2px;
  transition:background .5s}
.alinea.witregel{margin-bottom:1.55em}
.alinea.cursief{font-style:italic}
.regelgat{height:calc(1.55em * var(--regels,1))}
.alinea.vers{background:color-mix(in srgb,var(--signal) 20%,transparent);transition:background 0s}
.alinea.kopregel.onderstreept{text-decoration:underline;text-underline-offset:2px}
.alinea.kopregel.vet{font-weight:700}
.alinea.eigen{border-left:2px solid var(--accent);padding-left:9px;margin-left:-11px}
/* Aangeleverde specificaties staan in de brief strak onder elkaar. */
.alinea.leegregel{min-height:1.55em}
.alinea.opsomming{padding-left:16px}
.alinea.opsomming::before{content:"-";position:absolute;left:2px}
.alinea b{font-weight:700}

/* waarom-markering */
.waarom .alinea[data-waarom]{cursor:help}
.waarom .alinea[data-waarom]::before{content:"";position:absolute;left:-16px;top:3px;bottom:3px;
  width:2px;background:var(--signal);border-radius:1px}
.alinea[data-waarom]:hover .tip{opacity:1;transform:translateY(0);pointer-events:auto}
.tip{position:absolute;left:-16px;top:calc(100% + 5px);z-index:9;opacity:0;pointer-events:none;
  transform:translateY(-3px);transition:opacity .13s,transform .13s;
  background:var(--ink);color:var(--ground);font-family:var(--ui);font-size:11px;
  line-height:1.45;padding:6px 9px;border-radius:6px;max-width:290px;box-shadow:var(--shadow)}
.tip b{font-family:var(--mono);font-weight:500;font-size:10.5px}
body:not(.waarom) .tip{display:none}

.plus{position:absolute;right:-34px;top:0;width:24px;height:24px;border-radius:6px;
  border:1px dashed var(--paper-line);background:transparent;color:#9A9182;
  cursor:pointer;opacity:0;transition:.13s;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.sectie:hover .plus{opacity:1}
.plus:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
@media (max-width:760px){.plus{display:none}}

.leeg{color:#A79E8E;font-style:italic}


.foutbalk{width:100%;max-width:640px;background:var(--signal-soft);
  border:1px solid var(--signal);border-radius:8px;padding:10px 13px;
  font-size:12.5px;line-height:1.45;color:var(--signal)}
.meldbalk{width:100%;max-width:640px;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:8px;padding:10px 13px;
  font-size:12.5px;line-height:1.45;color:var(--accent)}
.eigeninvoer{display:block;width:100%;margin:0 0 7px;padding:3px 6px;
  border:1px solid var(--accent);border-radius:3px;background:transparent;
  font:inherit;color:inherit}
.legenda{width:100%;max-width:640px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);padding:2px 2px 0}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.staaf{width:2px;height:12px;border-radius:1px;background:var(--signal)}
.staaf.blauw{background:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* Twee standen. Bediend door de app stuurt deze pagina de antwoorden naar
   Python en toont wat daar uitkomt; dan kan het scherm niet uit de pas lopen met
   het Word-bestand. Staat er geen motor achter, dan rekent hij de brief zelf uit
   met de spiegel hieronder -- dat is de ontwerpversie.

   Waaraan we dat herkennen: de app antwoordt op /app. Niet aan het protocol,
   want het ontwerpbestand wordt ook over https bediend en dan is er geen
   Python; de pagina bleef dan leeg. */
let VIA_APP = false;
async function isErEenMotor(){
  try{
    const antwoord = await fetch("app", {cache:"no-store"});
    if(!antwoord.ok) return false;
    return (await antwoord.json()).app === true;
  }catch(_){ return false }
}

/* Het echte briefpapier uit sjablonen/brief.docx. Alleen beschikbaar wanneer de
   app draait; los geopend valt de voorvertoning terug op een eenvoudige kop met
   de melding dat het briefpapier ontbreekt. */
let BRIEFPAPIER = null;
async function haalBriefpapier(){
  if(!VIA_APP) return null;
  try{
    const uit = await (await fetch("briefpapier")).json();
    return uit.fout ? null : uit;
  }catch(_){ return null }
}

  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==="'"||c==='"'){const q=c;let j=i+1,v="";while(j<s.length&&s[j]!==q){v+=s[j++]}
      t.push({k:"str",v});i=j+1;continue}
    if(/[0-9]/.test(c)){let j=i,v="";while(j<s.length&&/[0-9.]/.test(s[j])){v+=s[j++]}
      t.push({k:"num",v:parseFloat(v)});i=j;continue}
    if(/[A-Za-z_]/.test(c)){let j=i,v="";while(j<s.length&&/[A-Za-z0-9_]/.test(s[j])){v+=s[j++]}
      t.push({k:"naam",v});i=j;continue}
    const twee=s.slice(i,i+2);
    if(["==","!=",">=","<="].includes(twee)){t.push({k:"op",v:twee});i+=2;continue}
    if("<>().,".includes(c)){t.push({k:c==="("||c===")"?c:(c==="."||c===",")?c:"op",v:c});i++;continue}
    i++;
  }
  return t;
}
function ontleed(tokens){
  let p=0;
  const kijk=()=>tokens[p], hap=()=>tokens[p++];
  const isNaam=v=>kijk()&&kijk().k==="naam"&&kijk().v===v;

  function ternair(){
    const waar=of_();
    if(isNaam("if")){hap();const test=of_();
      let anders={k:"lit",v:""};
      if(isNaam("else")){hap();anders=of_()}
      return {k:"als",test,waar,anders};}
    return waar;
  }
  function of_(){let l=en_();while(isNaam("or")){hap();l={k:"of",l,r:en_()}}return l}
  function en_(){let l=niet();while(isNaam("and")){hap();l={k:"en",l,r:niet()}}return l}
  function niet(){if(isNaam("not")){hap();return {k:"niet",e:niet()}}return vergelijk()}
  function vergelijk(){
    let l=primair();
    while(kijk()&&((kijk().k==="op"&&["==","!=",">","<",">=","<="].includes(kijk().v))||isNaam("in"))){
      const op=hap().v==="in"?"in":tokens[p-1].v;
      l={k:"cmp",op,l,r:primair()};
    }
    return l;
  }
  function primair(){
    const t=kijk();
    if(!t)return {k:"lit",v:null};
    if(t.k==="("){hap();const e=ternair();if(kijk()&&kijk().k===")")hap();return e}
    if(t.k==="str"||t.k==="num"){hap();return {k:"lit",v:t.v}}
    if(t.k==="naam"){
      hap(); let knoop={k:"naam",v:t.v};
      while(kijk()&&(kijk().k==="."||kijk().k==="(")){
        if(kijk().k==="."){hap();const n=hap();knoop={k:"attr",e:knoop,naam:n?n.v:""}}
        else{hap();const args=[];
          while(kijk()&&kijk().k!==")"){args.push(ternair());if(kijk()&&kijk().k===",")hap()}
          if(kijk())hap();
          knoop={k:"roep",naam:knoop.v,args};}
      }
      return knoop;
    }
    hap(); return {k:"lit",v:null};
  }
  return ternair();
}
const FUNCTIES={
  telwoord:n=>["nul","één","twee","drie","vier","vijf","zes","zeven","acht","negen","tien"][n]??String(n),
  bedrag:v=>formatBedrag(v),
};
function reken(n,ctx){
  switch(n.k){
    case "lit": return n.v;
    case "naam": return ctx[n.v];
    case "attr": {const d=reken(n.e,ctx); return (d&&typeof d==="object")?d[n.naam]:null}
    case "roep": {const f=FUNCTIES[n.naam]; return f?f(...n.args.map(a=>reken(a,ctx))):null}
    case "niet": return !reken(n.e,ctx);
    case "en": {const l=reken(n.l,ctx); return l?reken(n.r,ctx):l}
    case "of": {const l=reken(n.l,ctx); return l?l:reken(n.r,ctx)}
    case "als": return reken(n.test,ctx)?reken(n.waar,ctx):reken(n.anders,ctx);
    case "cmp": {
      const a=reken(n.l,ctx), b=reken(n.r,ctx);
      switch(n.op){
        case "==":return a===b; case "!=":return a!==b;
        case ">":return a!=null&&b!=null&&a>b; case "<":return a!=null&&b!=null&&a<b;
        case ">=":return a!=null&&b!=null&&a>=b; case "<=":return a!=null&&b!=null&&a<=b;
        case "in":return Array.isArray(b)?b.includes(a):(typeof b==="string"?b.includes(a):false);
      }
      return false;
    }
  }
  return null;
}
const cacheAst=new Map();
function evalueer(expr,ctx){
  if(!expr||!expr.trim())return true;
  if(!cacheAst.has(expr))cacheAst.set(expr,ontleed(tokeniseer(expr)));
  return reken(cacheAst.get(expr),ctx);
}

const MAANDEN=["januari","februari","maart","april","mei","juni","juli","augustus",
  "september","oktober","november","december"];
function formatBedrag(v){
  if(v===null||v===undefined||v==="")return "";
  const n=typeof v==="number"?v:parseFloat(String(v).replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",","."));
  if(isNaN(n))return "";
  const heel=Math.trunc(Math.abs(n)), cent=Math.round((Math.abs(n)-heel)*100);
  const dz=heel.toLocaleString("nl-NL");
  return "€ "+(n<0?"-":"")+dz+(cent?","+String(cent).padStart(2,"0"):",-");
}
function formatDatum(iso){
  if(!iso)return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d))return iso;
  return d.getDate()+" "+MAANDEN[d.getMonth()]+" "+d.getFullYear();
}
function formatPostcode(p){
  const k=(p||"").replace(/\s/g,"").toUpperCase();
  return /^[0-9]{4}[A-Z]{2}$/.test(k)?k.slice(0,4)+" "+k.slice(4):(p||"");
}

/* Hoeveel binnen- en buitendelen een installatieregel aanbiedt -- spiegelt

function geheel(waarde,terugval){
  const getal=parseInt(String(waarde??"").trim(),10);
  return Number.isFinite(getal)&&getal>0 ? getal : terugval;

function aantallen(regel){
  const systemen=geheel(regel.aantal_systemen,1);
  if(regel.systeemsoort==="splitsystem")return [systemen,systemen];
  return [geheel(regel.aantal_binnendelen,systemen),
          geheel(regel.aantal_buitendelen,systemen)];
}

const KOPPEN_VET=new Set(["Aanbieding","Opdracht","Tot slot","TECHNISCHE SPECIFICATIES",
  "Technische specificaties","Uitgangspunten:","Elektra:"]);
function isKopregel(kaal){
  // Een korte regel die op een dubbele punt eindigt is een sectiekop; de grens
  // van 45 tekens is nagemeten aan de bronbrieven. Zie _is_kopregel.
  return kaal.endsWith(":")&&kaal.length<=45&&!kaal.includes(". ");
}
function splitsBedrag(regel){
  // In de brieven staat het bedrag tot en met "netto." vet en de aanloopzin niet.
  const plek=regel.indexOf("\u20ac");
  return plek===-1?[regel,""]:[regel.slice(0,plek),regel.slice(plek)];
}
function naarAlineas(ingevuld,blok,reden){
  // Spiegelt _naar_alineas in samenstellen.py: Word kent geen regelovergang
  // binnen een alinea, dus elk blok wordt per regel opgesplitst.
  // Aangeleverde tekst wordt regel voor regel overgenomen, inclusief de lege
  // regels die er de units mee scheiden.
  if(blok.stijl==="letterlijk"){
    return ingevuld.split("\n").map(r=>({tekst:r.replace(/\s+$/,""),stijl:"tekst",
      nadruk:"",uitgelijnd:false,letterlijk:true,cursief:!!blok.c,los:!!blok.w,
      blok,reden}));
  }
  const uit=[];
  for(const regel of ingevuld.split("\n")){
    const kaal=regel.trim();
    if(!kaal)continue;
    // Een regel die met een tab of een vaste spatie begint is een uitgelijnde
    // vervolgregel; een streepje daarin hoort bij de tekst.
    const uitgelijnd=regel.startsWith("\t")||regel.startsWith("\u00a0");
    let stijl, tekst;
    if(uitgelijnd){stijl="tekst";tekst=regel.replace(/\s+$/,"")}
    else if(blok.stijl){stijl=blok.stijl;tekst=kaal}
    else if(kaal.startsWith("- ")){stijl="opsomming";tekst=kaal.slice(2).trim()}
    else if(KOPPEN_VET.has(kaal)){stijl="kopvet";tekst=kaal}
    else if(isKopregel(kaal)){stijl="kop";tekst=kaal}
    else{stijl="tekst";tekst=kaal}
    let nadruk="";
    if(stijl==="prijs"){[tekst,nadruk]=splitsBedrag(tekst)}
    else if(stijl==="label"&&tekst.includes("\t")){
      const i=tekst.indexOf("\t"); nadruk=tekst.slice(i+1); tekst=tekst.slice(0,i);
    }
    // Een cursief blok geeft dat door aan zijn regels, behalve aan de kopregel:
    // in de bronbrieven is geen enkele kop schuingedrukt.
    uit.push({tekst,stijl,nadruk,uitgelijnd,letterlijk:false,
              cursief:!!blok.c&&stijl!=="kop"&&stijl!=="kopvet",los:!!blok.w,
              blok,reden});
  }
  return uit;
}
// In de briefkop staat de witruimte vast in het sjabloon: het adresblok staat
// aaneengesloten, en onder "Meerkerk <datum>" komt een lege regel waarna project
// no. en Ref. weer tegen elkaar aan staan. Zie sjabloonbody in maak_sjabloon.py.
const KOPSECTIES_AANEEN=["geadresseerde","betreft","aanhef"];
// De werkzaamhedenlijst: opsommingsregels staan tegen elkaar aan, zonder lege
// regel na de kop erboven -- behalve de kop zelf, die krijgt er wél een; ook
// tussen de twee koppen komt geen lege regel. Spiegelt AANEENGESLOTEN_SECTIES
// in samenstellen.py.
const AANEENGESLOTEN_SECTIES=["werkzaamheden_inclusief","werkzaamheden_exclusief"];
const LAATSTE_AANEENGESLOTEN="werkzaamheden_exclusief";

function zetWitregels(alineas,sectie){
  // Spiegelt _zet_witregels: na elke alinea een lege regel, behalve tussen twee
  // opsommingsregels, voor een uitgelijnde vervolgregel en binnen letterlijke
  // tekst -- die bepaalt zijn eigen witruimte.
  if(KOPSECTIES_AANEEN.includes(sectie))
    return alineas.map(a=>Object.assign({},a,{witregel_erna:false}));
  if(sectie==="kenmerken")
    return alineas.map((a,n)=>Object.assign({},a,{witregel_erna:n===0}));
  if(AANEENGESLOTEN_SECTIES.includes(sectie))
    return alineas.map((a,n)=>Object.assign({},a,{witregel_erna:
      n===0 || (n===alineas.length-1&&sectie===LAATSTE_AANEENGESLOTEN)}));
  return alineas.map((a,n)=>{
    const volgende=alineas[n+1];
    const aaneengesloten=!!volgende&&(
      // Opsommingsregels staan tegen elkaar aan, behalve in een blok dat er
      // zelf een lege regel tussen wil -- zoals de aansprakelijkheid.
      (a.stijl==="opsomming"&&volgende.stijl==="opsomming"&&!a.los)
      ||volgende.uitgelijnd||a.letterlijk);
    return Object.assign({},a,{witregel_erna:!aaneengesloten});
  });
}
function vulIn(tekst,ctx){
  return tekst.replace(/\{\{(.+?)\}\}/g,(_,e)=>{
    const w=evalueer(e.trim(),ctx);
    return (w===null||w===undefined||w===false)?"":String(w);
  }).replace(/ {2,}/g," ").split("\n").map(r=>r.replace(/\s+$/,"")).join("\n").trim();
}
function redenVan(blok,ctx){
  if(!blok.v)return null;
  const m=blok.v.match(/([a-z_]+)\s*(==|!=|>|<|>=|<=)\s*'?([^']*)'?/);
  if(m)return {veld:m[1],waarde:ctx[m[1]]};
  const l=blok.v.match(/'([^']+)'\s+in\s+([a-z_]+)/);
  if(l)return {veld:l[2],waarde:l[1]};
  const n=blok.v.match(/^([a-z_]+)$/);
  if(n)return {veld:n[1],waarde:ctx[n[1]]?"ja":"nee"};
  return {veld:blok.v,waarde:""};
}

    const erbij=installaties.length>1?" van regel "+(n+1):"";
    // De ruimte mag leeg blijven; dan komt er gewoon geen kopregel boven de
    // installatie. Alleen een eigen opstelling per regel noemt hem bij naam.
    if(gevuld(inst.opstelling_buitenunit)&&!gevuld(inst.ruimte))
      uit.push("de ruimte"+erbij);
    for(const [veld,omschrijving] of INSTALLATIEVELDEN)
      if(!gevuld(inst[veld]))uit.push(omschrijving+erbij);
    if((inst.systeemsoort==="multi-splitsystem"||inst.systeemsoort==="vrf")
       &&!gevuld(inst.type_buitendeel))uit.push("het type buitendeel"+erbij);
  });
  if(A.technische_specificaties==="uitgeschreven"
     &&!gevuld(A.technische_specificaties_tekst)&&!gevuld(A.specBestand))
    uit.push("de technische specificaties");
  return uit;
}
function ontbreektMelding(ontbreekt){
  const lijst=ontbreekt.length===1 ? ontbreekt[0]
    : ontbreekt.slice(0,-1).join(", ")+" en "+ontbreekt[ontbreekt.length-1];
  return "De brief is nog niet compleet: "+lijst+
    (ontbreekt.length===1?" ontbreekt":" ontbreken")+" nog. Vul dat eerst in; "+
    "anders staat er straks een gat in de brief.";
}

function stelSamen(){
  const ctx=bouwContext(), uit={}, gebruikt=[];
  const vergeven=new Set();
  // Elk blok telt hoogstens één keer mee, ook als het per installatie wordt
  // herhaald; zo telt het scherm hetzelfde als _onthoud in samenstellen.py.
  const onthoud=id=>{ if(!gebruikt.includes(id))gebruikt.push(id) };
  for(const sectie of SECTIES){
    const alineas=[], lijst=LOOP[sectie], regels=lijst?(ctx[lijst]||[]):[];
    const blokken=BLOKKEN.filter(b=>b.sectie===sectie);
    let i=0;
    while(i<blokken.length){
      const herhaalt=lijst&&verwijstNaarRegel(blokken[i]);
      const groep=[];
      while(i<blokken.length&&(lijst&&verwijstNaarRegel(blokken[i]))===herhaalt){groep.push(blokken[i++])}
      if(herhaalt){
        regels.forEach((regel,n)=>{
          const lok=Object.assign({},ctx,{regel,regelnummer:n+1});
          for(const b of groep){ if(evalueer(b.v,lok)){
            naarAlineas(vulIn(b.t,lok),b,redenVan(b,lok)).forEach(x=>alineas.push(x));
            onthoud(b.id);}}
        });
      }else{
        for(const b of groep){
          if(b.g&&vergeven.has(b.g))continue;
          if(evalueer(b.v,ctx)){
            naarAlineas(vulIn(b.t,ctx),b,redenVan(b,ctx)).forEach(x=>alineas.push(x));
            onthoud(b.id); if(b.g)vergeven.add(b.g);
          }
        }
      }
    }
    for(const eigen of (A.eigenAlineas[sectie]||[]))
      alineas.push({tekst:eigen,stijl:"tekst",nadruk:"",uitgelijnd:false,
                    letterlijk:false,eigen:true});
    uit[sectie]=zetWitregels(alineas,sectie);
  }
  return {secties:uit,gebruikt,ctx};
}

// Deze secties staan los in het sjabloon omdat ze een eigen plaats of
// inspringing hebben; de rest loopt door één lus. Zie KOPSECTIES in sjabloon.py.
const KOPSECTIES=["geadresseerde","betreft","kenmerken","aanhef"];
const STIJL_TEKST="Standaard", STIJL_OPSOMMING="Lijstalinea";
const LIJST_ID="3";        // de lijstdefinitie in numbering.xml die het streepje levert
const LABEL_GROOTTE="14";  // "Betreft" en "Meerkerk" staan op 7 punten

/* --- de alinea's, gelijk aan tools/maak_sjabloon.py ------------------- */
function xmlUit(t){
  // Zoals Jinja met autoescape het doet, want daar komt de Python-versie langs.
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&#34;").replace(/'/g,"&#39;");
}
function pAlinea(tekst,keuzes){
  const k=keuzes||{};
  let eigenschappen="";
  if(k.stijl||k.hangend!==undefined){
    eigenschappen="<w:pPr>"+(k.stijl?`<w:pStyle w:val="${k.stijl}"/>`:"")+
      (k.hangend!==undefined?`<w:ind w:hanging="${k.hangend}"/>`:"")+"</w:pPr>";
  }
  // Met een leeg tekstelement erin, zodat de alinea niet als <w:p /> wordt
  // weggeschreven; zie de uitleg bij PARAGRAAFTAG in sjabloon.py.
  if(!tekst) return `<w:p>${eigenschappen}<w:r><w:t xml:space="preserve"></w:t></w:r></w:p>`;
  const kenmerken=(k.vet?"<w:b/>":"")+(k.onderstreept?'<w:u w:val="single"/>':"")+
    (k.cursief?"<w:i/>":"");
  const opmaak=kenmerken?`<w:rPr>${kenmerken}</w:rPr>`:"";
  return `<w:p>${eigenschappen}<w:r>${opmaak}`+
    `<w:t xml:space="preserve">${xmlUit(tekst)}</w:t></w:r></w:p>`;
}
const pLeeg=(aantal)=>pAlinea("").repeat(aantal===undefined?1:aantal);

function pOpsomming(tekst,cursief){
  // De stijl Lijstalinea zorgt alleen voor de inspringing; het streepje komt
  // uit de verwijzing naar numbering.xml.
  return `<w:p><w:pPr><w:pStyle w:val="${STIJL_OPSOMMING}"/>`+
    `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${LIJST_ID}"/></w:numPr>`+
    `</w:pPr><w:r>${cursief?"<w:rPr><w:i/></w:rPr>":""}`+
    `<w:t xml:space="preserve">${xmlUit(tekst)}</w:t></w:r></w:p>`;
}
function pPrijs(a){
  // Aanloopzin gewoon, bedrag tot en met "netto." vet: twee tekstdelen.
  return `<w:p><w:pPr><w:pStyle w:val="${STIJL_TEKST}"/></w:pPr>`+
    `<w:r><w:t xml:space="preserve">${xmlUit(a.tekst)}</w:t></w:r>`+
    `<w:r><w:rPr><w:b/></w:rPr>`+
    `<w:t xml:space="preserve">${xmlUit(a.nadruk)}</w:t></w:r></w:p>`;
}
function pLabel(a,hangend,inhoudVet){
  // Het label ("Betreft", "Meerkerk") staat op 7 punten en hangt in de marge,
  // de inhoud staat op de gewone grootte achter een tab.
  const opmaak=inhoudVet?"<w:rPr><w:b/></w:rPr>":"";
  return `<w:p><w:pPr><w:ind w:hanging="${hangend}"/></w:pPr>`+
    `<w:r><w:rPr><w:sz w:val="${LABEL_GROOTTE}"/></w:rPr>`+
    `<w:t xml:space="preserve">${xmlUit(a.tekst)}</w:t></w:r>`+
    (a.nadruk
      ? `<w:r><w:rPr><w:sz w:val="${LABEL_GROOTTE}"/></w:rPr><w:tab/></w:r>`+
        `<w:r>${opmaak}<w:t xml:space="preserve">${xmlUit(a.nadruk)}</w:t></w:r>`
      : "")+
    "</w:p>";
}
function tabsNaarWord(xml){
  // Een tab die uit de gegevens komt belandt als los teken in een <w:t> en
  // wordt door Word als spatie weergegeven. Zie tabs_naar_word in sjabloon.py.
  return xml.replace(/<w:t\b[^>]*>([^<]*)<\/w:t>/g,(heel,inhoud)=>{
    if(!inhoud.includes("\t"))return heel;
    return inhoud.split("\t").map((stuk,n)=>
      (n?"<w:tab/>":"")+(stuk?`<w:t xml:space="preserve">${stuk}</w:t>`:"")).join("");
  });
}

/* De body: dezelfde opbouw als sjabloonbody() in tools/maak_sjabloon.py, maar
   dan met de alinea's er meteen in in plaats van met lussen. Het aantal lege
   alinea's boven het adresblok en de inspringingen zijn nagemeten aan de
   bronbrief. */
function maakBody(secties){
  const sectie=naam=>secties[naam]||[];
  const delen=[pLeeg(4)];                       // ruimte voor de briefkop
  for(const a of sectie("geadresseerde")) delen.push(pAlinea(a.tekst));
  delen.push(pLeeg(6));
  for(const a of sectie("betreft")) delen.push(pLabel(a,709,true));
  delen.push(pLeeg(1));
  sectie("kenmerken").forEach((a,n)=>{
    delen.push(n===0?pLabel(a,851,false):pAlinea(a.tekst));
    if(n===0)delen.push(pLeeg(1));
  });
  delen.push(pLeeg(3));
  for(const a of sectie("aanhef")) delen.push(pAlinea(a.tekst));
  delen.push(pLeeg(1));
  for(const naam of SECTIES){
    if(KOPSECTIES.includes(naam))continue;
    const alineas=sectie(naam);
    if(!alineas.length)continue;               // anders levert de sectie een lege regel op
    for(const a of alineas){
      if(a.stijl==="kop")delen.push(pAlinea(a.tekst,{onderstreept:true}));
      else if(a.stijl==="kopvet")delen.push(pAlinea(a.tekst,{vet:true}));
      else if(a.stijl==="opsomming")delen.push(pOpsomming(a.tekst,a.cursief));
      else if(a.stijl==="prijs")delen.push(pPrijs(a));
      else delen.push(pAlinea(a.tekst,{stijl:STIJL_TEKST,cursief:a.cursief}));
      if(a.witregel_erna)delen.push(pLeeg(1));
    }
  }
  return delen.join("");
}

/* Zet de body in word/document.xml en laat de rest van het bestand ongemoeid.
   Niet met een XML-lezer: het hoofdelement declareert tientallen namespaces en
   somt er in mc:Ignorable een aantal van op; opnieuw wegschrijven hernoemt
   prefixen en maakt die opsomming ongeldig, waarna Word het bestand als
   beschadigd beschouwt. */
function maakDocument(documentXml,secties){
  const opening=/<w:body[^>]*>/.exec(documentXml);
  if(!opening)throw new Error("Het sjabloon bevat geen <w:body>.");
  const einde=documentXml.lastIndexOf("</w:body>");
  // De sectPr onderaan de body bewaart paginaformaat, marges, titlePg en de
  // verwijzingen naar de kop- en voetteksten. Die moet blijven staan.
  const sectpr=documentXml.lastIndexOf("<w:sectPr",einde);
  const begin=opening.index+opening[0].length;
  const staart=sectpr>begin?sectpr:einde;
  return tabsNaarWord(documentXml.slice(0,begin)+maakBody(secties)+documentXml.slice(staart));
}

/* --- de zip eromheen -------------------------------------------------- */
function base64NaarBytes(tekst){
  const kaal=atob(tekst), uit=new Uint8Array(kaal.length);
  for(let i=0;i<kaal.length;i++)uit[i]=kaal.charCodeAt(i);
  return uit;
}
function leesZip(data){
  const lees=(p,n)=>{let v=0;for(let i=n-1;i>=0;i--)v=v*256+data[p+i];return v};
  let eind=-1;
  for(let i=data.length-22;i>=0;i--){
    if(data[i]===0x50&&data[i+1]===0x4b&&data[i+2]===0x05&&data[i+3]===0x06){eind=i;break}
  }
  if(eind<0)throw new Error("Het ingebakken sjabloon is geen geldig zip-bestand.");
  let p=lees(eind+16,4);
  const aantal=lees(eind+10,2), ontcijfer=new TextDecoder(), uit=[];
  for(let n=0;n<aantal;n++){
    const naamlengte=lees(p+28,2), extra=lees(p+30,2), commentaar=lees(p+32,2);
    const kop=lees(p+42,4);
    uit.push({
      naam:ontcijfer.decode(data.subarray(p+46,p+46+naamlengte)),
      methode:lees(p+10,2), crc:lees(p+16,4),
      gepakt:lees(p+20,4), uitgepakt:lees(p+24,4),
      begin:kop+30+lees(kop+26,2)+lees(kop+28,2),
    });
    p+=46+naamlengte+extra+commentaar;
  }
  return uit;
}
async function pakUit(data,ingang){
  const rauw=data.subarray(ingang.begin,ingang.begin+ingang.gepakt);
  if(ingang.methode===0)return rauw;
  const stroom=new Blob([rauw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stroom).arrayBuffer());
}
const CRC_TABEL=(()=>{
  const t=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}
  return t;
})();
function crc32(bytes){
  let c=-1;
  for(let i=0;i<bytes.length;i++)c=CRC_TABEL[(c^bytes[i])&255]^(c>>>8);
  return (c^-1)>>>0;
}
/* Schrijft de onderdelen als zip. De onderdelen die niet veranderen gaan er
   ingepakt en al weer in; alleen het nieuwe document.xml wordt onverpakt
   opgenomen, zodat er in de browser niets gecomprimeerd hoeft te worden. */
function schrijfZip(onderdelen){
  const codeer=new TextEncoder(), stukken=[], centraal=[];
  let plek=0;
  const getal=(waarde,lengte)=>{
    const u=new Uint8Array(lengte);
    let v=waarde;
    for(let i=0;i<lengte;i++){u[i]=v&255;v=Math.floor(v/256)}
    return u;
  };
  const plak=(...delen)=>{
    const lengte=delen.reduce((n,d)=>n+d.length,0), uit=new Uint8Array(lengte);
    let p=0;
    for(const d of delen){uit.set(d,p);p+=d.length}
    return uit;
  };
  const PK=(a,b)=>new Uint8Array([0x50,0x4b,a,b]);
  const DATUM=33;   // 1 januari 1980, net als de zip die Python schrijft
  for(const o of onderdelen){
    const naam=codeer.encode(o.naam);
    const kop=plak(PK(3,4),getal(20,2),getal(0,2),getal(o.methode,2),getal(0,2),
      getal(DATUM,2),getal(o.crc,4),getal(o.data.length,4),getal(o.uitgepakt,4),
      getal(naam.length,2),getal(0,2),naam);
    centraal.push(plak(PK(1,2),getal(20,2),getal(20,2),getal(0,2),getal(o.methode,2),
      getal(0,2),getal(DATUM,2),getal(o.crc,4),getal(o.data.length,4),getal(o.uitgepakt,4),
      getal(naam.length,2),getal(0,2),getal(0,2),getal(0,2),getal(0,2),getal(0,4),
      getal(plek,4),naam));
    stukken.push(kop,o.data);
    plek+=kop.length+o.data.length;
  }
  const map=plak(...centraal);
  return plak(...stukken,map,PK(5,6),getal(0,2),getal(0,2),
    getal(onderdelen.length,2),getal(onderdelen.length,2),
    getal(map.length,4),getal(plek,4),getal(0,2));
}

/* Het Word-bestand: het ingebakken sjabloon met een nieuwe body erin. */
async function maakWordBestand(secties){
  if(!SJABLOON)throw new Error(
    "Het sjabloon zit niet in dit bestand. Draai ontwerp/ververs_prototype.py.");
  const zip=base64NaarBytes(SJABLOON);
  const ingangen=leesZip(zip);
  const document_xml=ingangen.find(o=>o.naam==="word/document.xml");
  if(!document_xml)throw new Error("Het ingebakken sjabloon is geen Word-bestand.");
  const xml=new TextDecoder().decode(await pakUit(zip,document_xml));
  const nieuw=new TextEncoder().encode(maakDocument(xml,secties));
  return schrijfZip(ingangen.map(o=>o.naam==="word/document.xml"
    ? {naam:o.naam,methode:0,crc:crc32(nieuw),uitgepakt:nieuw.length,data:nieuw}
    : {naam:o.naam,methode:o.methode,crc:o.crc,uitgepakt:o.uitgepakt,
       data:zip.subarray(o.begin,o.begin+o.gepakt)}));
}

// Afwijkend van het origineel (dat hier achternaam-plaats-sa_nummer
// gebruikte, zie _bestandsnaam in server.py): deze tool hoort bij de
// calculatietool, en de twee bestanden van hetzelfde project (de calculatie
// en de brief) horen dezelfde klantnaam/projectnaam in hun bestandsnaam te
// dragen -- zie CALCULATIE_CONCEPT_SLEUTEL verderop. Zonder bekend
// calculatieproject (bijv. de brief los gebruikt) valt dit terug op de
// oorspronkelijke naamgeving.
function projectMetaVanCalculatie(){
  try{
    const bewaard=localStorage.getItem(CALCULATIE_CONCEPT_SLEUTEL);
    if(!bewaard)return null;
    const project=JSON.parse(bewaard);
    return (project&&project.calculatie&&project.calculatie.meta)||null;
  }catch(_){ return null }
}
function veiligeNaamdeel(t){
  return String(t||"").trim().replace(/[\\/:*?"<>|]+/g,"-");
}
function bestandsnaam(){
  const meta=projectMetaVanCalculatie();
  const delen=meta?[meta.klantnaam,meta.projectnaam].map(veiligeNaamdeel).filter(Boolean):[];
  if(delen.length)return "Brief-"+delen.join("-")+".docx";
  const kaal=[A.achternaam||"offerte",A.plaats||"",A.sa_nummer||""]
    .map(d=>String(d).trim()).filter(Boolean).join("-");
  const veilig=[...kaal].map(t=>/[\p{L}\p{N}\-_]/u.test(t)?t:"-").join("");
  return (veilig.replace(/^-+|-+$/g,"").toLowerCase()||"offerte")+".docx";
}

function keuzesUit(sectie){

function zetVeld(veld,ctx){
  if(veld.als&&!veld.als())return null;

    const s=el("div"); s.innerHTML=veld.tekst(ctx); d.appendChild(s);

  if(veld.t==="segment"){

    veld.opties.forEach(([v,l])=>{
      const b=el("button",null,l); b.type="button";
      b.setAttribute("aria-pressed",String(A[veld.n]===v));
      b.onclick=()=>{

        if(veld.n==="klanttype")zetBetaalafspraken();
        // Een opdrachtbevestiging begint met de bevestiging van de opdracht;
        // ga je terug naar een offerte, dan past die zin niet meer.
        if(veld.n==="documentsoort"){
          if(v==="opdrachtbevestiging")A.aanleiding="opdrachtbevestiging";
          else if(A.aanleiding==="opdrachtbevestiging")A.aanleiding="aanvraag";
        }
        ververs();
      };
      s.appendChild(b);
    });
    w.appendChild(s);
  } else if(veld.t==="keuze"){
    const s=el("select"); s.id="f-"+veld.n;
    const opties=typeof veld.opties==="function"?veld.opties():veld.opties;
    opties.forEach(([v,l])=>{const o=el("option",null,l);o.value=v;if(A[veld.n]===v)o.selected=true;s.appendChild(o)});
    s.onchange=()=>{A[veld.n]=s.value;ververs()};
    w.appendChild(s);
  } else if(veld.t==="vink"){
    const lb=el("label","vink"); const i=el("input"); i.type="checkbox"; i.checked=!!A[veld.n];
    i.onchange=()=>{A[veld.n]=i.checked;ververs()};
    lb.append(i,el("span",null,veld.l)); w.appendChild(lb);
  } else if(veld.t==="vinklijst"){
    w.appendChild(Object.assign(el("div","blabel"),{textContent:veld.l}));
    const lijst=el("div","vinklijst");
    BLOKKEN.filter(b=>b.sectie===veld.sectie&&b.o).forEach(b=>{
      const m=b.v.match(/'([^']+)'\s+in/); if(!m)return;
      const sleutel=m[1];
      const lb=el("label","vink"); const i=el("input"); i.type="checkbox";
      i.checked=A[veld.n].includes(sleutel);
      i.onchange=()=>{
        A[veld.n]=i.checked?[...A[veld.n],sleutel]:A[veld.n].filter(x=>x!==sleutel);
        ververs();
      };
      lb.append(i,el("span",null,b.o)); lijst.appendChild(lb);
    });
    w.appendChild(lijst);

/* Leest het datablad in de browser. .txt en .md rechtstreeks; een .docx is een
   zip met XML, die we met DecompressionStream uitpakken -- zo hoeft er geen
   bibliotheek van buiten geladen te worden. Voor een PDF laat de echte tool het
   uitlezen aan de Python-kant. */
async function leesDatablad(bestand){
  const naam=bestand.name, soort=naam.slice(naam.lastIndexOf(".")).toLowerCase();
  try{
    let tekst;
    if(VIA_APP){
      // De app leest het bestand met dezelfde code die ook bij het maken van de
      // brief wordt gebruikt -- inclusief PDF.
      const bytes=new Uint8Array(await bestand.arrayBuffer());
      let binair=""; for(const b of bytes) binair+=String.fromCharCode(b);
      const antwoord=await fetch("datablad",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({naam,inhoud:btoa(binair)})});
      const uit=await antwoord.json();
      if(uit.fout) throw new Error(uit.fout);
      A.specBestand=naam; A.technische_specificaties_tekst=uit.tekst;
      ververs(); return;
    }
    if(soort===".txt"||soort===".md") tekst=await bestand.text();
    else if(soort===".docx"||soort===".dotx") tekst=await tekstUitWord(bestand);
    else if(soort===".pdf") tekst="(PDF wordt uitgelezen bij het maken van de brief)";
    else throw new Error("Dit bestandssoort kan ik niet lezen: "+soort);
    A.specBestand=naam;
    A.technische_specificaties_tekst=tekst.replace(/\s+$/,"");
    ververs();
  }catch(fout){
    // Geen alert(): een ingelijste pagina (het scherm als artefact) mag geen
    // vensters openen, en dan zou er zichtbaar niets gebeuren.
    toonFout("Kon "+naam+" niet lezen: "+fout.message+
             " Je kunt de tekst ook rechtstreeks plakken in het veld eronder.");
  }
}

async function tekstUitWord(bestand){
  const data=new Uint8Array(await bestand.arrayBuffer());
  const xml=await pakUitZip(data,"word/document.xml");
  if(!xml) throw new Error("Geen word/document.xml gevonden; is dit een Word-bestand?");
  const regels=[];
  for(const alinea of xml.match(/<w:p\b[^>]*\/>|<w:p\b[\s\S]*?<\/w:p>/g)||[]){
    let regel="";
    for(const stuk of alinea.match(/<w:t[^>]*>[^<]*<\/w:t>|<w:tab\/>/g)||[]){
      regel += stuk==="<w:tab/>" ? "\t" : stuk.replace(/<[^>]+>/g,"");
    }
    regels.push(regel.replace(/\s+$/,""));
  }
  while(regels.length&&!regels[0].trim())regels.shift();
  while(regels.length&&!regels[regels.length-1].trim())regels.pop();
  if(!regels.length) throw new Error("Er staat geen tekst in dit bestand.");
  return regels.join("\n");
}

/* Minimale zip-uitpakker: zoekt het onderdeel in de centrale map en laat
   DecompressionStream het uitpakken. */
async function pakUitZip(data,gezocht){
  const lees=(p,n)=>{let v=0;for(let i=n-1;i>=0;i--)v=v*256+data[p+i];return v};
  let eind=-1;
  for(let i=data.length-22;i>=0;i--){
    if(data[i]===0x50&&data[i+1]===0x4b&&data[i+2]===0x05&&data[i+3]===0x06){eind=i;break}
  }
  if(eind<0) throw new Error("Dit is geen geldig zip-bestand.");
  let p=lees(eind+16,4);
  const aantal=lees(eind+10,2);
  const ontcijfer=new TextDecoder();
  for(let n=0;n<aantal;n++){
    const naamlengte=lees(p+28,2), extra=lees(p+30,2), commentaar=lees(p+32,2);
    const naam=ontcijfer.decode(data.subarray(p+46,p+46+naamlengte));
    if(naam===gezocht){
      const kop=lees(p+42,4);
      const methode=lees(kop+8,2);
      const gepakt=lees(kop+18,4);
      const lokaalNaam=lees(kop+26,2), lokaalExtra=lees(kop+28,2);
      const begin=kop+30+lokaalNaam+lokaalExtra;
      const rauw=data.subarray(begin,begin+gepakt);
      if(methode===0) return ontcijfer.decode(rauw);
      const stroom=new Blob([rauw]).stream()
        .pipeThrough(new DecompressionStream("deflate-raw"));
      return ontcijfer.decode(await new Response(stroom).arrayBuffer());
    }
    p += 46+naamlengte+extra+commentaar;
  }
  return null;
}

// Word-bestand dat de tool zelf maakt.
const BOVEN_HET_ADRES=4;

function tekenBrief(resultaat,alleenNieuw){
  const vel=document.getElementById("vel");
  vel.innerHTML="";
  const c=resultaat.ctx;

  vel.appendChild(tekenBriefpapier());
  vel.appendChild(regelgat(BOVEN_HET_ADRES));

  const nieuweTekst=new Map();
  for(const sectie of SECTIES){
    const alineas=resultaat.secties[sectie]||[];
    if(!alineas.length)continue;
    const s=el("div","sectie"); s.dataset.sectie=sectie;
    alineas.forEach((a,n)=>{
      const p=el("p","alinea");
      if(a.eigen)p.classList.add("eigen");
      if(a.stijl==="kop"){p.classList.add("kopregel","onderstreept")}
      else if(a.stijl==="kopvet"){p.classList.add("kopregel","vet")}
      else if(a.stijl==="opsomming"){p.classList.add("opsomming")}
      if(a.letterlijk){p.classList.add("letterlijk");
        if(!a.tekst.trim())p.classList.add("leegregel")}
      if(a.witregel_erna)p.classList.add("witregel");
      if(a.cursief)p.classList.add("cursief");
      // De motor levert tekst en nadruk apart: bij een prijsregel staat het
      // bedrag vet en de aanloopzin niet, bij een label staat de inhoud achter
      // een tab. In Word zijn dat twee tekstdelen; hier plakken we ze aaneen.
      p.appendChild(document.createTextNode(a.stijl==="label"&&a.nadruk
        ? a.tekst+"\t"+a.nadruk : a.tekst));
      if(a.nadruk&&a.stijl!=="label")p.appendChild(el("b",null,a.nadruk));
      const sleutel=sectie+"#"+n;
      nieuweTekst.set(sleutel,a.tekst+a.nadruk);
      if(alleenNieuw&&vorigeTekst.has(sleutel)&&vorigeTekst.get(sleutel)!==a.tekst){
        p.classList.add("vers"); requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove("vers")));
      }
      if(a.reden&&a.reden.veld&&!a.eigen){
        p.dataset.waarom="1";
        const tip=el("div","tip");
        const naamVeld=LABELS[a.reden.veld]||a.reden.veld;
        const w=a.reden.waarde;
        tip.innerHTML="Gekozen omdat <b>"+esc(naamVeld)+"</b> = <b>"+esc(w===true?"ja":w===false?"nee":(w??"—"))+"</b>";
        p.appendChild(tip);
      }
      s.appendChild(p);
    });
    const plus=el("button","plus","+"); plus.type="button";
    plus.title="Eigen alinea toevoegen aan deze sectie";
    plus.onclick=()=>{
      if(s.querySelector(".eigeninvoer"))return;
      const invoer=el("input","eigeninvoer");
      invoer.placeholder="Eigen alinea \u2014 enter om toe te voegen, esc om te stoppen";
      const bewaar=()=>{
        const tekst=invoer.value.trim();
        invoer.remove();
        if(tekst){(A.eigenAlineas[sectie]=A.eigenAlineas[sectie]||[]).push(tekst);ververs()}
      };
      invoer.onkeydown=ev=>{
        if(ev.key==="Enter"){ev.preventDefault();bewaar()}
        else if(ev.key==="Escape"){invoer.value="";invoer.remove()}
      };
      invoer.onblur=bewaar;
      s.insertBefore(invoer,plus); invoer.focus();
    };
    s.appendChild(plus);
    vel.appendChild(s);
    if(KOPGAT[sectie])vel.appendChild(regelgat(KOPGAT[sectie]));
  }
  vorigeTekst=nieuweTekst;


  document.getElementById("telling").textContent=
    resultaat.gebruikt.length+" tekstblokken · "+
    Object.values(resultaat.secties).reduce((n,a)=>n+a.length,0)+" alinea's";
  document.getElementById("k-project").textContent=A.projectnummer||"—";
  document.getElementById("k-ref").textContent=c.referentie||"—";

  // Dezelfde lijst als die het Word-bestand tegenhoudt; draait de app, dan komt
  // hij van de motor zodat er maar één waarheid is.
  const leeg=resultaat.ontbreekt||ontbrekendeGegevens();
  const o=document.getElementById("ontbreekt");
  o.textContent=leeg.length?"nog invullen: "+leeg.join(", "):"alles ingevuld";
  o.style.color=leeg.length?"var(--signal)":"var(--muted)";
}

/* Tekent de briefkop en de voettekst zoals ze in het sjabloon staan: het logo op
   zijn eigen plek, de bedrijfsgegevens rechtsboven, de voorwaardentekst onderaan.

function tekenBriefpapier(){
  const houder=el("div");
  if(!BRIEFPAPIER){
    const melding=el("div","papiermelding");
    melding.textContent = VIA_APP
      ? "Briefpapier niet gevonden — draai: python3 tools/maak_sjabloon.py"
      : "Ontwerpversie: het briefpapier zit in het Word-bestand, niet in deze voorvertoning.";
    houder.appendChild(melding);
    return houder;
  }
  const p=BRIEFPAPIER.pagina, kop=el("div","papierkop");
  for(const beeld of BRIEFPAPIER.kop.beelden){
    const afb=el("img"); afb.src="beeld/"+encodeURIComponent(beeld.naam); afb.alt="";
    afb.style.width=`calc(${beeld.breedte} * var(--mm))`;
    afb.style.height=`calc(${beeld.hoogte} * var(--mm))`;
    afb.style.left=`calc(${(beeld.links_vanaf==="margin"?p.links:0)+(beeld.links??0)} * var(--mm))`;
    afb.style.top=`calc(${beeld.boven??0} * var(--mm))`;
    kop.appendChild(afb);
  }
  const gegevens=el("div","papiergegevens");
  gegevens.textContent=BRIEFPAPIER.kop.regels.join("\n");
  kop.appendChild(gegevens);
  houder.appendChild(kop);

  const voet=el("div","papiervoet");
  voet.textContent=BRIEFPAPIER.voet.regels.join(" ");
  for(const beeld of BRIEFPAPIER.voet.beelden){
    const afb=el("img"); afb.src="beeld/"+encodeURIComponent(beeld.naam); afb.alt="";
    afb.style.width=`calc(${beeld.breedte} * var(--mm))`;
    afb.style.height=`calc(${beeld.hoogte} * var(--mm))`;
    afb.style.right="0"; afb.style.bottom=`calc(${(beeld.hoogte)+2} * var(--mm))`;
    voet.appendChild(afb);
  }
  houder.appendChild(voet);
  return houder;
}

  if(uit.fout){ toonFout(uit.fout); return null }
  toonFout(null);
  const secties={};
  for(const sectie of uit.secties){
    // De motor levert alinea's in dezelfde vorm als de spiegel hierboven, dus

    secties[sectie.naam]=zetWitregels(sectie.alineas.map(a=>({
      tekst:a.tekst, stijl:a.stijl, nadruk:a.nadruk, uitgelijnd:a.uitgelijnd,

      sectie.naam);
  }
  return {secties,gebruikt:uit.blokken,ctx:uit.kenmerken,
          waarschuwingen:uit.waarschuwingen,ontbreekt:uit.ontbreekt};
}

function toonFout(tekst){
  let balk=document.getElementById("foutbalk");
  if(!tekst){ if(balk)balk.remove(); return }
  if(!balk){ balk=el("div","foutbalk"); balk.id="foutbalk";
    document.querySelector(".briefkant").prepend(balk) }
  balk.textContent=tekst;
}

function toonMelding(tekst){
  // Geen alert(): een ingelijste pagina mag geen venster openen. De melding
  // verdwijnt vanzelf, zodat hij niet in de weg blijft staan.
  let balk=document.getElementById("meldbalk");
  if(balk)balk.remove();
  if(!tekst)return;
  balk=el("div","meldbalk"); balk.id="meldbalk"; balk.textContent=tekst;
  document.querySelector(".briefkant").prepend(balk);
  setTimeout(()=>{ if(balk.isConnected)balk.remove() },6000);
}

function ververs(alleenBrief){
  bewaarConcept();
  if(VIA_APP)return verversViaApp(alleenBrief);
  const resultaat=stelSamen();
  tekenBrief(resultaat,true);
  if(alleenBrief){
    // Tijdens typen het formulier niet opnieuw opbouwen: dat zou de cursor verplaatsen.
    clearTimeout(bezigMetTypen);
    bezigMetTypen=setTimeout(()=>{
      const actief=document.activeElement;
      if(!actief||actief.tagName!=="INPUT")tekenVragen(resultaat.ctx);
      else{document.querySelectorAll(".gsamen").forEach((e,i)=>{e.textContent=GROEPEN[i].samen()})}
    },350);
    return;
  }
  tekenVragen(resultaat.ctx);
}

async function verversViaApp(alleenBrief){
  let resultaat;
  try{ resultaat=await vraagAanApp() }
  catch(fout){
    // De motor is onderweg weggevallen; verder met de eigen berekening zodat
    // het scherm blijft werken in plaats van leeg te raken.
    VIA_APP=false; toonFout("De verbinding met de tool is weg; het scherm rekent "
      +"nu zelf. Het Word-bestand maken werkt pas weer na een herstart.");
    return ververs(alleenBrief);
  }
  if(resultaat){
    tekenBrief(resultaat,true);
    if(resultaat.waarschuwingen&&resultaat.waarschuwingen.length)
      toonFout("Let op: "+resultaat.waarschuwingen.join(" · "));
  }
  if(alleenBrief){
    clearTimeout(bezigMetTypen);
    bezigMetTypen=setTimeout(()=>{
      const actief=document.activeElement;
      if(!actief||(actief.tagName!=="INPUT"&&actief.tagName!=="TEXTAREA"))tekenVragen({});
      else document.querySelectorAll(".gsamen").forEach((e,i)=>{e.textContent=GROEPEN[i].samen()});
    },350);
    return;
  }
  tekenVragen({});
}

/* Het Word-bestand. Draait de app erachter, dan maakt Python het bestand -- die
   is de maat. Zonder app maakt het scherm het zelf uit het ingebakken sjabloon;
   tests/test_spiegel.py toetst dat daar hetzelfde uitkomt. */
async function haalWordVanApp(){
  const antwoord=await fetch("docx",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(A)});
  const soort=antwoord.headers.get("Content-Type")||"";
  if(soort.includes("json"))throw new Error((await antwoord.json()).fout||"onbekende fout");
  return new Uint8Array(await antwoord.arrayBuffer());
}

/* Het bestand aan de gebruiker geven. In een ingelijste pagina mag dat alleen
   via de opslagvraag van de omgeving; een gewone koppeling doet daar niets. */
async function bewaarBestand(naam,bytes){
  const opslag=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;
  if(opslag){
    try{
      await opslag.save({filename:naam,data:bytes});
      return "Het bestand "+naam+" is klaar.";
    }catch(fout){
      const code=(fout&&fout.code)||"";
      if(code==="declined")return "Het opslaan is afgebroken.";
      if(code==="rate_limited")throw new Error("Er staat al een opslagvraag open; probeer het zo nog eens.");
      if(code==="rejected_extension"||code==="extension_not_enabled")
        throw new Error("Deze weergave mag geen Word-bestanden opslaan. Open de tool op "+
          "je eigen computer (python3 -m brieventool.server) om de brief te maken.");
      throw new Error("Het bestand kon niet worden opgeslagen: "+((fout&&fout.message)||fout));
    }
  }
  if(window.claude)throw new Error("Deze weergave kan geen bestand opslaan. Open de tool op "+
    "je eigen computer (python3 -m brieventool.server) om de brief te maken.");
  const koppeling=document.createElement("a");
  koppeling.href=URL.createObjectURL(new Blob([bytes],
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));
  koppeling.download=naam;
  document.body.appendChild(koppeling); koppeling.click(); koppeling.remove();
  setTimeout(()=>URL.revokeObjectURL(koppeling.href),4000);
  return "Het bestand "+naam+" is gedownload.";
}

/* De bestandsnaam is aan te passen voordat het bestand er is: de knop opent
   een veldje met de voorgestelde naam erin. Wat de gebruiker daar neerzet
   blijft staan, met de mogelijkheid om het voorstel terug te halen. */
const naamkiezer=document.getElementById("naamkiezer");
const naamveld=document.getElementById("veld-bestandsnaam");
const naamvoorstel=document.getElementById("knop-voorstel");

function kaleNaam(naam){
  // Zonder .docx en zonder tekens die in een bestandsnaam niet thuishoren.
  return String(naam).replace(/\.docx$/i,"").replace(/[\\/:*?"<>|]+/g,"-").trim();
}
function sluitNaamkiezer(){ naamkiezer.hidden=true }
function openNaamkiezer(){
  const voorstel=kaleNaam(bestandsnaam());
  naamveld.value=kaleNaam(A.bestandsnaam||voorstel);
  naamvoorstel.hidden=naamveld.value===voorstel;
  naamvoorstel.textContent="Voorstel gebruiken: "+voorstel;
  naamvoorstel.onclick=()=>{ naamveld.value=voorstel; naamvoorstel.hidden=true; naamveld.focus() };
  naamkiezer.hidden=false;
  naamveld.focus(); naamveld.select();
}
naamveld.onkeydown=ev=>{
  if(ev.key==="Enter"){ev.preventDefault();maakWord()}
  else if(ev.key==="Escape"){ev.preventDefault();sluitNaamkiezer()}
};
document.getElementById("knop-naam-af").onclick=sluitNaamkiezer;
document.getElementById("knop-naam-ok").onclick=()=>maakWord();
document.addEventListener("click",ev=>{
  if(!naamkiezer.hidden&&!naamkiezer.contains(ev.target)&&ev.target.id!=="knop-word")
    sluitNaamkiezer();
});

async function maakWord(){
  const knop=document.getElementById("knop-word"), oud=knop.textContent;
  const gekozen=kaleNaam(naamveld.value)||kaleNaam(bestandsnaam());
  A.bestandsnaam=gekozen;
  sluitNaamkiezer();
  knop.disabled=true; knop.textContent="Bezig\u2026";
  try{
    const bytes=VIA_APP ? await haalWordVanApp()
      : await maakWordBestand(stelSamen().secties);
    toonMelding(await bewaarBestand(gekozen+".docx",bytes));
  }catch(fout){
    toonFout("Het Word-bestand kon niet gemaakt worden: "+fout.message);
  }finally{ knop.disabled=false; knop.textContent=oud }
}

document.getElementById("knop-word").onclick=()=>{
  // Een gat in een verstuurde brief valt niemand meer op; hier nog wel.
  const ontbreekt=ontbrekendeGegevens();
  if(ontbreekt.length){ sluitNaamkiezer(); toonFout(ontbreektMelding(ontbreekt)); return }
  toonFout(null);
  if(naamkiezer.hidden)openNaamkiezer(); else sluitNaamkiezer();
};


/* ==================================================================
   Bewaren en hervatten — een brief is zelden in één keer af
   ================================================================== */
const CONCEPT="brieventool.concept";     // waar de browser het werk bewaart
const BESTANDSMERK="brieventool-offerte";

function vulAntwoorden(nieuw){
  // A is een const die overal is doorgegeven, dus vullen in plaats van vervangen.
  for(const sleutel of Object.keys(A))delete A[sleutel];
  Object.assign(A,JSON.parse(JSON.stringify(nieuw)));
}

/* De browser onthoudt waar je gebleven was. Alleen op deze computer en in deze
   browser: het is een vangnet tegen een dichtgeklapt tabblad, geen archief. */
let bewaarWacht=null;
function bewaarConcept(){
  clearTimeout(bewaarWacht);
  bewaarWacht=setTimeout(()=>{
    try{ localStorage.setItem(CONCEPT,JSON.stringify(A)) }
    catch(_){ /* privévenster of vol geheugen; dan gewoon niet */ }
  },400);
}
function haalConceptOp(){
  try{
    const bewaard=localStorage.getItem(CONCEPT);
    return bewaard?JSON.parse(bewaard):null;
  }catch(_){ return null }
}
function vergeetConcept(){
  try{ localStorage.removeItem(CONCEPT) }catch(_){}
}

/* Opslaan als bestand: dat kun je bewaren, mailen of later weer openen. */
async function slaOfferteOp(){
  const inhoud=JSON.stringify({
    [BESTANDSMERK]:1, opgeslagen:new Date().toISOString(), antwoorden:A,
  },null,1);
  const naam=(A.bestandsnaam||kaleNaam(bestandsnaam()))+".json";
  try{
    toonMelding(await bewaarBestand(naam,new TextEncoder().encode(inhoud)));
  }catch(fout){ toonFout("Opslaan lukte niet: "+fout.message) }
}

async function openOfferte(bestand){
  try{
    const gelezen=JSON.parse(await bestand.text());
    const antwoorden=gelezen&&gelezen.antwoorden;
    if(!antwoorden||typeof antwoorden!=="object")
      throw new Error("dit is geen opgeslagen offerte van de brieventool");
    vulAntwoorden(antwoorden);
    ververs();
    toonFout(null);
    toonMelding("De offerte uit "+bestand.name+" staat klaar.");
  }catch(fout){
    toonFout("Kon "+bestand.name+" niet openen: "+fout.message);
  }
}

function nieuweBrief(){
  vulAntwoorden(BEGINSTAND);
  vergeetConcept();
  ververs();
  toonFout(null);
  toonMelding("Een nieuwe brief; de vorige is niet bewaard.");
}

document.getElementById("knop-opslaan").onclick=()=>slaOfferteOp();
document.getElementById("knop-openen").onclick=()=>

/* ==================================================================
   Koppeling met de calculatietool — niet in het origineel (de losstaande
   brieventool kende geen calculatiestap), toegevoegd voor deze samengevoegde
   tool. Alles hierboven is verder ongewijzigd overgenomen.
   ================================================================== */
// Dezelfde sleutel als AUTOSAVE_SLEUTEL in scherm/gedeeld.js -- dat bestand
// bewaart daar het hele project (calculatie + voorheen ook de brief); hier
// wordt alleen de calculatiekant ervan gelezen, nooit weggeschreven.
const CALCULATIE_CONCEPT_SLEUTEL="calcubrief.concept";
// Gezet door scherm/index.html vlak vóór de navigatie hierheen (zie
// btnNaarBrief in calculatie.js), zodat de overdracht hier automatisch één
// keer wordt toegepast in plaats van dat de gebruiker daarna nog apart op
// "Vanuit calculatie" moet klikken -- dat werd eerder gemist.
const NAVIGATIE_VLAG="calcubrief.naarBrief";

function calculatieStaatOphalen(){
  try{
    const bewaard=localStorage.getItem(CALCULATIE_CONCEPT_SLEUTEL);
    if(!bewaard)return null;
    const project=JSON.parse(bewaard);
    return (project&&project.calculatie)||null;
  }catch(_){ return null }
}

const nieuweInstallatie=()=>({ruimte:"",eigen_kop:"",aantal_systemen:1,
  systeemsoort:"splitsystem",montagewijze:"",merk:MERKEN[0],
  type_binnendeel:"",aantal_binnendelen:2});

// De eerste keer (nog geen installaties uit de calculatie toegepast) worden
// de voorbeeldinstallaties van A vervangen -- die overschrijven zou raar
// weinig zeggende regels achterlaten (bijv. een handmatig ingevulde "ruimte"
// naast een merk uit de calculatie) als de aantallen niet overeenkomen. Bij
// een volgende keer (na eigen aanpassingen in de brief) juist per regel
// samenvoegen, zodat die aanpassingen niet verloren gaan.
function installatiesSamenvoegen(bestaand,overgenomen,vervangen){
  if(vervangen||!bestaand.length)
    return overgenomen.map(regel=>Object.assign(nieuweInstallatie(),regel));
  return bestaand.map((regel,i)=>overgenomen[i]?Object.assign({},regel,overgenomen[i]):regel)
    .concat(overgenomen.slice(bestaand.length).map(regel=>Object.assign(nieuweInstallatie(),regel)));
}

async function vulVanuitCalculatie(){
  const staat=calculatieStaatOphalen();
  if(!staat){
    toonFout("Geen calculatieproject gevonden — vul eerst iets in bij stap 1 (Calculatie).");
    return;
  }
  let antwoord;
  try{
    antwoord=await fetch("overdracht",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({calculatie:staat,klanttype:A.klanttype})});
  }catch(_){
    toonFout("Kon de calculatiegegevens niet ophalen; is de tool nog verbonden?");
    return;
  }
  const uit=await antwoord.json();
  if(uit.fout){ toonFout("Kon de overdracht niet maken: "+uit.fout); return }

  const {offerte,overdracht}=uit;
  const vervangenInstallaties=!A._vanuitCalculatieToegepast;
  for(const [sleutel,waarde] of Object.entries(offerte)){
    if(sleutel==="installaties")
      A.installaties=installatiesSamenvoegen(A.installaties,waarde,vervangenInstallaties);
    else A[sleutel]=waarde;
  }
  A._vanuitCalculatieToegepast=true;
  ververs();

  // Nooit stilzwijgend: dezelfde "afgeleid"-status als overdracht.py
  // teruggeeft (zie de moduledocstring daar) wordt hier expliciet genoemd in
  // plaats van weggelaten, ook al heeft dit scherm geen los badge-systeem
  // per veld zoals de rest van de tool dat kent.
  const controleren=overdracht.filter(v=>v.status==="afgeleid").map(v=>v.pad);
  if(controleren.length)
    toonFout("Vanuit de calculatie ingevuld — controleer: "+controleren.join(", ")+".");
  else
    toonMelding("Vanuit de calculatie ingevuld.");
}

document.getElementById("knop-vanuit-calculatie").onclick=()=>vulVanuitCalculatie();

function verwerkNavigatieVlag(){
  let gezet=false;
  try{ gezet=sessionStorage.getItem(NAVIGATIE_VLAG)==="1"; sessionStorage.removeItem(NAVIGATIE_VLAG) }
  catch(_){ /* privévenster; dan gewoon niet automatisch invullen */ }
  if(gezet)vulVanuitCalculatie();
}

(async () => {
  VIA_APP = await isErEenMotor();
