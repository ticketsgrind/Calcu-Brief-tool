- id: kredietwaardigheid
  sectie: voorwaarden
  voorwaarde: "klanttype == 'zakelijk'"
  bron: 13 sjablonen
  tekst: |
    Kredietwaardigheid:
    Na ontvangst van een opdracht wordt door ons de kredietwaardigheid van de opdrachtgever getoetst bij onze kredietadviseurs. Indien dit advies daartoe aanleiding geeft, is het mogelijk dat er t.o.v. de in de offerte c.q. opdrachtbevestiging genoemde betalingscondities afwijkende condities overeengekomen dienen te worden.

- id: algemene_voorwaarden
  sectie: voorwaarden
  voorwaarde: ""
  bron: alle 15 sjablonen, letterlijk gelijk
  tekst: |
    Algemene voorwaarden:
    Wij leveren volgens de algemene leverings- en betalingsvoorwaarden van de Koninklijke Metaalunie (Metaalunievoorwaarden), gedeponeerd ter griffie van de rechtbank te Rotterdam, zoals deze luiden volgens de laatstelijk aldaar neergelegde tekst, met uitsluiting van (alle) andere algemene voorwaarden. De voorwaarden worden u op verzoek toegezonden.

- id: garantie_standaard
  sectie: garantie
  cursief: true
  omschrijving: "12 maanden op materiaal en werk, plus fabrieksgarantie"
  voorwaarde: "installatietype != 'koelmachine'"
  bron: 14 sjablonen
  tekst: |
    Garantietermijn:
    De garantietermijn binnen Nederland is 12 maanden op geleverde materialen en door ons uitgevoerde werkzaamheden na inbedrijfstellen. Op geleverde onderdelen geldt een aanvullende fabrieksgarantie. Defecten welke te wijten zijn aan derden vallen buiten de garantie.

- id: garantie_koelmachine
  sectie: garantie
  cursief: true
  omschrijving: "Koelmachine: 12 maanden, max. 18 maanden na aflevering"
  voorwaarde: "installatietype == 'koelmachine'"
  bron: koelmachine.dotx
  tekst: |
    Garantietermijn:
    Gedurende 12 maanden na inbedrijfstelling op materiaal en arbeidsloon met een maximum van 18 maanden na aflevering (de kortste termijn is doorslaggevend).
    Op de compressor en MCHE condensorbatterijen geldt een aanvullende 24 maanden garantie op materiaal.
  # Wijkt af van de standaardtekst. Zie vragen.md #4.

- id: garantie_luchtslang
  sectie: garantie
  omschrijving: "KE-Fibertec luchtslang: 10 jaar materiaalgarantie"
  voorwaarde: "installatietype == 'luchtslangsysteem'"
  bron: KE-Fibertec halfrond luchtslangsysteem.dotx
  tekst: |
    Materiaal garantie:
    10 jaar garantie op de gehele slang inclusief ritsen en accessoires.

- id: aansprakelijkheid
  sectie: aansprakelijkheid
  witregel_tussen: true
  voorwaarde: ""
  bron: 13 sjablonen
  tekst: |
    Aansprakelijkheid:
    - Indien wij bij u betonboringen uitvoeren, zullen deze met de uiterste zorgvuldigheid worden uitgevoerd. Business Unit Schilt Airconditioning is echter niet aansprakelijk voor het eventueel – onverhoopt – beschadigen van (leidingen in) vloeren of wanden.
    - Wij willen u erop attenderen geen apparatuur onder de binnenunits te plaatsen. Indien er wel apparatuur onder de binnenunits wordt geplaatst, is Business Unit Schilt Airconditioning niet aansprakelijk voor eventuele schade als gevolg van - onverhoopte - condenslekkages.
  notitie: >
    Staat in alle sjablonen en verstuurde brieven ná de garantietermijn, niet
    ervoor; daarom een eigen sectie onder de garantie in plaats van bij de
    andere voorwaarden. De twee punten hebben in de bronbrieven een lege regel
    ertussen -- vandaar witregel_tussen -- terwijl opsommingsregels elders juist
    tegen elkaar aan staan.
  # cassette meervoud.dotx schrijft "Schilt Airconditioning B.V." in plaats van
  # "Business Unit Schilt Airconditioning". Zie vragen.md #11.

