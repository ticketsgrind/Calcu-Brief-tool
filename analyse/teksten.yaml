# Tekstblokkenbibliotheek Schilt Airconditioning
#
# Alle teksten zijn LETTERLIJK overgenomen uit bronbrieven/ en
# bronbrieven/uitgewerkt/. Er is niets herschreven. Waar de brieven zelf
# inconsistent zijn staan de varianten apart, met de vindplaats in `bron`
# en een verwijzing naar analyse/vragen.md.
#
# Schema per blok:
#   id            unieke sleutel
#   sectie        sectienaam uit skelet.md
#   omschrijving  label voor het keuzemenu (alleen bij keuzeblokken)
#   voorwaarde    Jinja-achtige expressie; leeg = altijd
#   bron          bestand(en) waar de tekst uit komt
#   tekst         letterlijke tekst met {{ }}-placeholders

blokken:

# ===========================================================================
# 2-6. GEADRESSEERDE, BETREFT, KENMERKEN, AANHEF
# ===========================================================================

- id: adres_organisatie
  sectie: geadresseerde
  voorwaarde: "klanttype == 'zakelijk' and organisatie"
  bron: uitgewerkt-1.docx, uitgewerkt-2.docx
  tekst: "{{ organisatie }}"

# Met een organisatie erboven staat de contactpersoon achter "T.a.v."; zonder
# organisatie begint de regel met een hoofdletter en vervalt "T.a.v.".
# Nagemeten in uitgewerkt-1, -2 en -3.
- id: adres_contactpersoon_tav
  sectie: geadresseerde
  keuzegroep: geadresseerde
  voorwaarde: "klanttype == 'zakelijk' and aanspreekvorm != 'Fam.' and organisatie"
  bron: uitgewerkt-1, uitgewerkt-2, alle sjablonen
  tekst: "T.a.v. {{ aanspreekvorm }} {{ voorletters }} {{ achternaam }}"
  notitie: >
    De klanttype-eis staat er expliciet bij sinds 17 september 2026: zonder die
    eis bleef een eerder ingevulde organisatie na het omschakelen naar
    particulier in A.organisatie staan (het veld verdwijnt uit beeld maar wordt
    niet geleegd), waardoor T.a.v. bij een particulier kon opduiken. T.a.v. is
    voor bedrijven; bij een particulier staat alleen "de heer"/"mevrouw".

- id: adres_contactpersoon
  sectie: geadresseerde
  keuzegroep: geadresseerde
  voorwaarde: "aanspreekvorm != 'Fam.'"
  bron: uitgewerkt-3
  tekst: "{{ aanspreekvorm_hoofdletter }} {{ voorletters }} {{ achternaam }}"

- id: adres_familie
  sectie: geadresseerde
  voorwaarde: "aanspreekvorm == 'Fam.'"
  bron: uitgewerkt-7.pdf
  tekst: "Fam. {{ achternaam }}"

- id: adres_regels
  sectie: geadresseerde
  voorwaarde: ""
  bron: alle uitgewerkte brieven
  tekst: |
    {{ straat_huisnummer }}
    {{ postcode }}  {{ plaats }}

- id: adres_email
  sectie: geadresseerde
  voorwaarde: "email_klant"
  bron: uitgewerkt-1, uitgewerkt-3
  tekst: "{{ email_klant }}"

- id: betreft
  sectie: betreft
  stijl: label
  omschrijving: "Betreft-regel"
  voorwaarde: ""
  bron: alle sjablonen en alle uitgewerkte brieven
  tekst: "Betreft	{{ betreft_onderwerp }} t.b.v. {{ locatieaanduiding }}"
  notitie: >
    Het eerste woord volgt het installatietype (Airconditioning, Koelmachine,
    Mechanische ventilatie). Het deel na "t.b.v." is vrije tekst; de vormen die
    in de brieven voorkomen zijn "uw woning", "uw vestiging te <plaats>",
    "uw project <projectnaam>", "uw <ruimten>" en "uw woning <adres> <plaats>".
    Er staan nergens aanhalingstekens omheen. Zie vragen.md vraag 3.

- id: kenmerken
  sectie: kenmerken
  stijl: label
  voorwaarde: ""
  bron: alle sjablonen
  tekst: |
    Meerkerk	{{ briefdatum }}
    Ons project no. {{ projectnummer }}
    Ref. {{ referentie }}

# De sjablonen bevatten vijf schrijfwijzen van de aanhef; zie vragen.md #5.
# Hieronder de vorm zoals die in de uitgewerkte brieven werkelijk wordt gebruikt.
- id: aanhef
  sectie: aanhef
  voorwaarde: ""
  bron: uitgewerkt-2.docx, uitgewerkt-3.docx, uitgewerkt-7.pdf
  tekst: "Geachte {{ aanspreekvorm_aanhef }} {{ achternaam_aanhef }},"

# ===========================================================================
# 7. AANLEIDING
# ===========================================================================

- id: aanleiding_onderhoud
  sectie: aanleiding
  keuzegroep: aanleiding
  omschrijving: "Na een bezoek of gesprek met een adviseur"
  voorwaarde: "aanleiding == 'onderhoud'"
  bron: wand enkelvoud.dotx, uitgewerkt-3.docx
  tekst: >
    Naar aanleiding van het aangenaam onderhoud tussen u en {{ adviseur }}
    d.d. {{ datum_aanleiding }} jl. doen wij u hiermede onze aanbieding toekomen
    voor het leveren en monteren van {{ installatie_omschrijving }} t.b.v.
    bovengenoemd project.

- id: aanleiding_aanvraag
  sectie: aanleiding
  keuzegroep: aanleiding
  omschrijving: "Na een aanvraag van de klant"
  voorwaarde: "aanleiding == 'aanvraag'"
  bron: wand enkelvoud.dotx, uitgewerkt-4.docx
  tekst: >
    Naar aanleiding van uw aanvraag d.d. {{ datum_aanleiding }} jl. doen wij u
    hiermede onze aanbieding toekomen voor het leveren en monteren van
    {{ installatie_omschrijving }} t.b.v. bovengenoemd project.

- id: aanleiding_telefonisch
  sectie: aanleiding
  keuzegroep: aanleiding
  omschrijving: "Na een telefonische aanvraag"
  voorwaarde: "aanleiding == 'telefonisch'"
  bron: wand meervoud particulier.docx
  tekst: >
    Naar aanleiding van uw telefonische aanvraag d.d. {{ datum_aanleiding }} jl.
    doen wij u hiermede onze aanbieding toekomen voor het leveren en monteren van
    {{ installatie_omschrijving }} t.b.v. bovengenoemd project.

- id: aanleiding_servicebezoek
  sectie: aanleiding
  keuzegroep: aanleiding
  omschrijving: "Na een servicebezoek"
  voorwaarde: "aanleiding == 'servicebezoek'"
  bron: uitgewerkt-6.pdf
  tekst: >
    Naar aanleiding van ons servicebezoek d.d. {{ datum_aanleiding }} jl. doen wij
    u hiermede onze aanbieding toekomen voor het leveren en monteren van een
    vervangende airconditioninginstallatie t.b.v. bovengenoemd project.

- id: aanleiding_opdrachtbevestiging
  sectie: aanleiding
  keuzegroep: aanleiding
  omschrijving: "Bevestiging van een ontvangen opdracht"
  voorwaarde: "aanleiding == 'opdrachtbevestiging'"
  bron: uitgewerkt-2.docx
  tekst: >
    Onder dankzegging bevestigen wij hiermede uw schriftelijke opdrachtnr.
    {{ opdrachtnummer }} d.d. {{ datum_aanleiding }} jl. voor het leveren en
    monteren van {{ installatie_omschrijving }} t.b.v. bovengenoemde vestiging.
  notitie: >
    Hing eerst aan documentsoort, maar binnen een keuzegroep wint het eerste
    blok dat past en dat was altijd een van de aanleidingen erboven -- deze zin
    kwam dus nooit in de brief. Nu is het een gewone keuze bij de aanleiding;
    het scherm zet hem voor zodra je een opdrachtbevestiging kiest. De datum
    komt uit hetzelfde veld als bij de andere aanleidingen.

# installatie_omschrijving is afgeleid van installatietype en het aantal
# installaties. Dit is de kern van het enkelvoud/meervoud-probleem:
#   airconditioning, 1 installatie  -> "een airconditioninginstallatie"
#   airconditioning, >1 installatie -> "airconditioninginstallaties"
#   koelmachine                     -> "een koelmachine"
#   mechanische ventilatie          -> "een mechanisch ventilatiesysteem"
#   warmtepomp                      -> "een warmtepompinstallatie"

- id: kop_aanbieding
  sectie: aanbieding
  voorwaarde: "documentsoort == 'offerte'"
  bron: 15 sjablonen
  tekst: |
    Aanbieding
    Wij specificeren onze aanbieding als volgt:

- id: kop_opdracht
  sectie: aanbieding
  voorwaarde: "documentsoort == 'opdrachtbevestiging'"
  bron: uitgewerkt-2.docx
  tekst: |
    Opdracht
    Wij specificeren de opdracht als volgt:

# ===========================================================================
# 10. AANBIEDINGSSPECIFICATIE  (loop over prijsregels)
# ===========================================================================

- id: spec_ruimte_kop_eigen
  sectie: specificatie
  stijl: kopvet
  omschrijving: "Eigen kopregel boven de installatie"
  voorwaarde: "regel.eigen_kop"
  bron: eigen invoer
  tekst: "{{ regel.eigen_kop }}:"
  notitie: >
    Voor een kop die niet met "T.b.v." begint, bijvoorbeeld "Vervanging
    airconditioning t.b.v. de serverruimte". De dubbele punt komt er zelf bij.
    Een keuzegroep werkt hier niet: de specificatie is een herhalende sectie en
    keuzegroepen gelden alleen buiten een lus, dus sluiten de twee voorwaarden
    elkaar uit.

- id: spec_ruimte_kop
  sectie: specificatie
  stijl: kopvet
  voorwaarde: "regel.ruimte and not regel.eigen_kop"
  bron: uitgewerkt-3.docx, uitgewerkt-7.pdf
  tekst: "T.b.v. {{ regel.ruimte }}:"

- id: spec_split
  sectie: specificatie
  omschrijving: "Enkelvoudig splitsysteem"
  voorwaarde: "regel.systeemsoort == 'splitsystem'"
  bron: wand enkelvoud.dotx, uitgewerkt-2.docx
  tekst: >
    Het leveren en monteren van {{ telwoord(regel.aantal_systemen) }} luchtgekoelde
    splitsystem inverterunit{{ 's' if regel.aantal_systemen > 1 }} geschikt voor
    {{ regel.montagewijze }} fabrikaat {{ regel.merk }} type {{ regel.type_binnendeel }}.

- id: spec_multisplit
  sectie: specificatie
  omschrijving: "Multi-splitsysteem: meerdere binnendelen op één buitendeel"
  voorwaarde: "regel.systeemsoort == 'multi-splitsystem'"
  bron: multi split.dotx, uitgewerkt-3.docx
  tekst: >
    Het leveren en monteren van één luchtgekoelde multi-splitsystem inverterunit
    geschikt voor {{ regel.montagewijze }} fabrikaat {{ regel.merk }} bestaande uit
    {{ regel.aantal_binnendelen }} binnendelen type {{ regel.type_binnendeel }} en
    {{ regel.aantal_buitendelen }} buitendeel type {{ regel.type_buitendeel }}.

- id: spec_vrf
  sectie: specificatie
  omschrijving: "VRF-systeem"
  voorwaarde: "regel.systeemsoort == 'vrf'"
  bron: VRF.dotx
  tekst: >
    Het leveren en monteren van één luchtgekoeld VRF systeem fabrikaat
    {{ regel.merk }} bestaande uit binnendelen type {{ regel.type_binnendeel }}
    en één buitendeel type {{ regel.type_buitendeel }}.

- id: spec_warmtepomp
  sectie: specificatie
  omschrijving: "Lucht-water warmtepomp"
  voorwaarde: "regel.systeemsoort == 'warmtepomp'"
  bron: warmtepomp.dotx
  tekst: >
    Het leveren en monteren van {{ regel.aantal_systemen }} stuks lucht-water
    warmtepomp fabrikaat {{ regel.merk }}

- id: spec_koelmachine
  sectie: specificatie
  omschrijving: "Carrier vloeistofkoelmachine"
  voorwaarde: "regel.systeemsoort == 'vloeistofkoelmachine'"
  bron: koelmachine.dotx
  tekst: >
    Het leveren en monteren van één Carrier luchtgekoelde vloeistofkoelmachine,
    type {{ regel.type_binnendeel }}, geschikt voor buitenopstelling. Deze volledig
    voor koudemiddel R410A ontwikkelde koelmachine is ontworpen voor een
    energiezuinige toepassing met een hoog deellast rendement (ESEER). De
    koelmachine heeft standaard een laaag geluidsniveau door de toepassing van
    scrolcompressoren en de unieke Flying Bird IV condensorventilatoren. De
    Condensorbatterijen (MCHE) zijn volledig vervaardigd van aluminium en hebben
    3,5 maal hogere corrosiebestendigheid dan koper-aluminium batterijen.
  notitie: '"laaag" en "scrolcompressoren" staan zo in het origineel. Zie vragen.md inconsistentie 9.'

# ===========================================================================
# 11. SYSTEEMOMSCHRIJVING  (per model binnenunit, enkelvoud + meervoud)
# ===========================================================================

- id: systeem_wand_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'wand' and aantal_binnenunits == 1"
  bron: wand enkelvoud.dotx
  tekst: >
    De binnenunit is ontworpen voor montage hoog aan de wand, hierdoor wordt de
    geconditioneerde lucht hoog in de ruimte ingeblazen waardoor een optimale
    luchtverdeling in de ruimte wordt gecreëerd.

- id: systeem_wand_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'wand' and aantal_binnenunits > 1"
  bron: wand meervoud.dotx
  tekst: >
    De binnenunits zijn ontworpen voor montage hoog aan de wand, hierdoor wordt de
    geconditioneerde lucht hoog in de ruimte ingeblazen waardoor een optimale
    luchtverdeling in de ruimte wordt gecreëerd.

- id: systeem_wand_zwenk_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'wand' and aantal_binnenunits == 1"
  bron: wand enkelvoud.dotx
  tekst: >
    De binnenunit is voorzien van een automatisch mechanisme dat voortdurend de
    hoek waaronder de luchtstroom wordt uitgeblazen verandert.

- id: systeem_wand_zwenk_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'wand' and aantal_binnenunits > 1"
  bron: wand meervoud.dotx
  tekst: >
    De binnenunits zijn voorzien van een automatisch mechanisme dat voortdurend de
    hoek waaronder de luchtstroom wordt uitgeblazen verandert.

- id: systeem_cassette_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'cassette' and aantal_binnenunits == 1"
  bron: cassette enkelvoud.dotx
  tekst: >
    De binnenunit is uitgevoerd als zogenaamde cassette-unit en is speciaal
    ontworpen voor inbouw in een verlaagd plafond. De benodigde ruimte tussen het
    systeemplafond hiervoor bedraagt 30 cm.

- id: systeem_cassette_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'cassette' and aantal_binnenunits > 1"
  bron: cassette meervoud.dotx
  tekst: >
    De binnenunits zijn uitgevoerd als zogenaamde cassette-units en zijn speciaal
    ontworpen voor inbouw in een verlaagd plafond. De benodigde ruimte tussen het
    systeemplafond hiervoor bedraagt 30 cm.

- id: systeem_cassette_schoepen
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'cassette'"
  bron: cassette enkelvoud.dotx, uitgewerkt-2.docx
  tekst: >
    Door de speciale vorm van de luchtgeleidende schoepen wordt de geconditioneerde
    lucht direct langs het plafond geleid waardoor een zeer gelijkmatige menging
    met de ruimtelucht wordt bereikt.

- id: systeem_kanaal_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'kanaal' and aantal_binnenunits == 1"
  bron: kanaal enkelvoud.dotx
  tekst: "De binnenunit is speciaal ontworpen voor plaatsing boven het verlaagd plafond."

- id: systeem_kanaal_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'kanaal' and aantal_binnenunits > 1"
  bron: kanaal meervoud.dotx, VRF.dotx
  tekst: "De binnenunits zijn speciaal ontworpen voor plaatsing boven het verlaagd plafond."

- id: systeem_vloer_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'vloer' and aantal_binnenunits == 1"
  bron: VRF.dotx
  tekst: >
    De binnenunit is speciaal ontworpen laag aan de muur waardoor de
    geconditioneerde lucht strak langs de muur wordt uitgeblazen en gelijkmatig in
    de ruimte wordt verdeeld.

- id: systeem_vloer_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'vloer' and aantal_binnenunits > 1"
  bron: multi split.dotx
  tekst: >
    De binnenunits zijn speciaal ontworpen laag aan de muur waardoor de
    geconditioneerde lucht strak langs de muur wordt uitgeblazen en gelijkmatig in
    de ruimte wordt verdeeld.

- id: systeem_plafondonderbouw_enkel
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'plafondonderbouw' and aantal_binnenunits == 1"
  bron: VRF.dotx, uitgewerkt-6.pdf
  tekst: >
    De binnenunit is speciaal ontworpen voor montage direct onder het plafond
    waardoor de geconditioneerde lucht strak onder het plafond wordt uitgeblazen en
    gelijkmatig in de ruimte wordt verdeeld.

- id: systeem_plafondonderbouw_meervoud
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'plafondonderbouw' and aantal_binnenunits > 1"
  bron: multi split.dotx
  tekst: >
    De binnenunits zijn speciaal ontworpen voor montage direct onder het plafond
    waardoor de geconditioneerde lucht strak onder het plafond wordt uitgeblazen en
    gelijkmatig in de ruimte wordt verdeeld.

- id: systeem_kanaal_toevoer
  sectie: systeemomschrijving
  voorwaarde: "model_binnenunit == 'kanaal'"
  bron: VRF.dotx, uitgewerkt-1.docx
  tekst: >
    Vanaf de binnenunits wordt de lucht, door middel van een geïsoleerd
    luchtkanalensysteem met regelkleppen en wervelroosters van het fabrikaat Trox
    in de ruimte toegevoerd.

- id: systeem_opbouw_enkel
  sectie: systeemomschrijving
  voorwaarde: "aantal_binnenunits == 1 and systeemsoort == 'splitsystem'"
  bron: wand enkelvoud.dotx
  tekst: >
    De installatie bestaat uit één binnenunit en één buitenunit die d.m.v.
    koelmiddelleidingen met elkaar verbonden worden.

- id: systeem_opbouw_meervoud
  sectie: systeemomschrijving
  voorwaarde: "aantal_binnenunits > 1"
  bron: uitgewerkt-7.pdf
  tekst: >
    De installaties bestaan uit één of meerdere binnenunits en één buitenunit die
    d.m.v. koelmiddelleidingen met elkaar verbonden worden.

- id: storingscontact_enkel
  sectie: systeemomschrijving
  omschrijving: "Bedrijf-/storingscontact voor koppeling aan het GBS"
  voorwaarde: "storingscontact and aantal_binnenunits == 1"
  bron: wand enkelvoud.dotx
  tekst: >
    De binnenunit wordt voorzien van een bedrijf-/storingscontact welke door derden
    dienen te worden bedraad en gekoppeld aan het gebouw beheer systeem (GBS) e.d.

- id: storingscontact_meervoud
  sectie: systeemomschrijving
  omschrijving: "Bedrijf-/storingscontact voor koppeling aan het GBS"
  voorwaarde: "storingscontact and aantal_binnenunits > 1"
  bron: cassette meervoud.dotx
  tekst: >
    De binnenunits worden voorzien van een bedrijf-/storingscontact welke door
    derden dienen te worden bedraad en gekoppeld aan het gebouw beheer systeem
    (GBS) e.d.

- id: verse_lucht_enkel
  sectie: systeemomschrijving
  omschrijving: "Verse-luchtaansluiting op de binnenunit"
  voorwaarde: "verse_luchtaansluiting and aantal_binnenunits == 1"
  bron: cassette enkelvoud.dotx
  tekst: >
    De binnenunit wordt voorzien van een verse luchtaansluiting compleet met de
    benodigde geïsoleerde flexibele slang,
    dakdoorvoering/wanddoorvoering/regenkap/buitenluchtrooster.

- id: verse_lucht_meervoud
  sectie: systeemomschrijving
  omschrijving: "Verse-luchtaansluiting op de binnenunits"
  voorwaarde: "verse_luchtaansluiting and aantal_binnenunits > 1"
  bron: cassette meervoud.dotx
  tekst: >
    De binnenunits worden voorzien van een verse luchtaansluiting compleet met de
    benodigde geïsoleerde flexibele slang,
    dakdoorvoering/wanddoorvoering/regenkap/buitenluchtrooster.

# ===========================================================================
# 12. BUITENUNIT
# ===========================================================================

# Per installatie een eigen opstelling. Gaat alleen mee als er bij een
# installatieregel een opstelling is ingevuld; anders geldt de keuze voor de
# hele brief, hieronder. Bron: uitgewerkt-3, waar de keuken tegen de gevel zit
# en de slaapkamer op de grond.
- id: buitenunit_per_installatie_muursteun
  sectie: buitenunit
  omschrijving: "Deze installatie: steunen tegen de gevel"
  voorwaarde: "regel.opstelling_buitenunit == 'muursteun'"
  bron: uitgewerkt-3.docx
  tekst: >
    De buitenunit voor {{ regel.ruimte }} wordt geplaatst op steunen met
    trillingsdempers tegen de buitengevel.

- id: buitenunit_per_installatie_platdak
  sectie: buitenunit
  omschrijving: "Deze installatie: opstelbalken op het platte dak"
  voorwaarde: "regel.opstelling_buitenunit == 'plat_dak'"
  bron: uitgewerkt-3.docx
  tekst: >
    De buitenunit voor {{ regel.ruimte }} wordt geplaatst op geluiddempende
    rubberen opstelbalken op het platte dak.

- id: buitenunit_per_installatie_grond
  sectie: buitenunit
  omschrijving: "Deze installatie: opstelbalken op de grond"
  voorwaarde: "regel.opstelling_buitenunit == 'grond'"
  bron: uitgewerkt-3.docx
  tekst: >
    De buitenunit voor {{ regel.ruimte }} wordt geplaatst op geluiddempende
    rubberen opstelbalken op de grond.

- id: buitenunit_per_installatie_bigfoot
  sectie: buitenunit
  omschrijving: "Deze installatie: BigFoot-frame op het platte dak"
  voorwaarde: "regel.opstelling_buitenunit == 'bigfoot'"
  bron: uitgewerkt-3.docx, VRF.dotx
  tekst: >
    De buitenunit voor {{ regel.ruimte }} wordt geplaatst met een metalen
    ondersteuningsframe (BigFoot) op het platte dak.

- id: buitenunit_muursteun_enkel
  sectie: buitenunit
  omschrijving: "Aan de gevel op steunen met trillingsdempers"
  voorwaarde: "not opstelling_per_installatie and opstelling_buitenunit == 'muursteun' and aantal_buitenunits == 1"
  bron: wand enkelvoud.dotx, uitgewerkt-4.docx
  tekst: "De buitenunit wordt geplaatst op steunen met trillingsdempers tegen de buitengevel."

- id: buitenunit_muursteun_meervoud
  sectie: buitenunit
